.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}.kp button{height:56px;border:0;border-radius:18px;background:var(--sf);color:var(--tx);font-size:1.25rem;cursor:pointer}

.ic2{font-style:normal;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;flex:none}.row.st{border-radius:16px;margin-bottom:8px}#hg{overflow-y:auto;min-height:0;flex:0 1 auto;touch-action:pan-y}
.bd2{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#e53935;color:#fff;font:700 .7rem system-ui;display:grid;place-items:center;padding:0 5px}.ic i{position:relative}
.pimg{border-radius:50%;object-fit:cover;flex:none}.chh{display:flex;align-items:center;gap:10px;padding:6px 12px}.msgs{flex:1;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}

</style></head><body>

<script>const GAMES={"bolu": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Bolu\u2019s Run Ultra<\/title>\n<style>\n:root{--bg:#eef3f7;--ink:#1d2b36;--btn:#1d2b36;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--ink:#e8eef2;--btn:#e8eef2;--btnink:#10171d}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--ink:#e8eef2;--btn:#e8eef2;--btnink:#10171d}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Trebuchet MS\",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;min-height:100vh}\nh1{margin:4px 0 0;font-size:1.3rem}\n#wrap{width:100%;max-width:800px}\ncanvas{width:100%;height:auto;display:block;border-radius:14px;touch-action:none}\n.hud{display:flex;justify-content:space-between;width:100%;max-width:800px;font-weight:bold;padding:0 4px}\n#pad{display:flex;justify-content:space-between;width:100%;max-width:800px;gap:10px}\n#pad div{display:flex;gap:10px}\n#pad button{width:76px;height:64px;font-size:1.5rem;border:0;border-radius:32px;background:var(--btn);color:var(--btnink);touch-action:none;user-select:none}\n#pad button:active{opacity:.7}\n#pad button:focus-visible{outline:3px solid #f5a524}\np{margin:0;font-size:.9rem;opacity:.8;text-align:center}\n<\/style>\n<\/head>\n<body>\n<h1>Bolu\u2019s Run Ultra<\/h1>\n<div class=\"hud\"><span id=\"sc\">Coins: 0<\/span><span id=\"wl\">World 1<\/span><span id=\"bs\">Best: 0<\/span><span id=\"lv\">Lives: 3<\/span><\/div>\n<div id=\"wrap\"><canvas id=\"c\" width=\"640\" height=\"448\"><\/canvas><\/div>\n<div id=\"pad\">\n  <div><button id=\"bl\" aria-label=\"Left\">\u25c0<\/button><button id=\"br\" aria-label=\"Right\">\u25b6<\/button><\/div>\n  <button id=\"bj\" aria-label=\"Jump\">\u25b2<\/button>\n<\/div>\n<p>Arrows or A/D to move, Space or W to jump, P to pause. Hit blocks from below, grab the pink berry for a shield, stomp slugs and bats.<\/p>\n<script>\nconst cv=document.getElementById('c'),g=cv.getContext('2d');\nconst T=32,H=14,W=130,VW=640;\nconst SK=[['#7cc8ff','#e3f6ff','#b9e6c2','#fff'],['#ff9a6b','#ffe3bd','#e59a86','#fff1e0'],['#141d3a','#3a4a7a','#26385f','#6b7aa8']];\nconst gaps=[22,23,38,39,40,58,59,78,79,80,81,100,101];\nlet map,coins,enemies,items,parts,pl,cam,score=0,lives=3,lvl=0,state='play',keys={},t=0,inv=0,shield=false;\n\nlet coy=0,buf=0,jHeld=false,paused=false,combo=0,pops=[];\nlet best=0;try{best=+localStorage.getItem('boluBest')||0}catch(e){}\nlet ac;\nfunction snd(f,d=.1,ty='square',s=0){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(s,n+d);v.gain.setValueAtTime(.05,n);v.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(v);v.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}\nfunction burst(x,y,c,n=8){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*5,l:30,c})}\n\nfunction build(){\n  map=Array.from({length:H},()=>Array(W).fill(' '));\n  for(let x=0;x<W;x++){if(gaps.includes(x))continue;map[12][x]='#';map[13][x]='#'}\n  const row=(x,y,n,ch)=>{for(let i=0;i<n;i++)map[y][x+i]=ch};\n  row(12,8,5,'B');map[8][14]='P';\n  row(28,9,3,'Q');row(31,9,2,'B');\n  row(44,8,4,'B');row(50,6,3,'B');map[6][51]='P';\n  row(64,9,5,'B');map[9][66]='Q';\n  row(84,8,3,'B');row(90,6,4,'B');map[6][92]='P';\n  row(104,9,4,'B');\n  for(let i=0;i<5;i++)for(let j=0;j<=i;j++)map[11-j][112+i]='#';\n  coins=[];\n  [[6,11],[7,11],[8,11],[13,7],[15,7],[22,9],[23,9],[29,8],[39,9],[45,7],[46,7],[51,5],[65,8],[79,9],[80,9],[86,7],[91,5],[93,5],[100,9],[105,8]].forEach(([x,y])=>coins.push({x:x*T+16,y:y*T+16,got:false}));\n  enemies=[];items=[];parts=[];\n  const sp=0.7+0.25*lvl;\n  let ws=[18,26,34,46,54,62,70,76,88,96,106];\n  if(lvl>=1)ws=ws.concat([30,42,66,84,92,102]);\n  ws.forEach((x,i)=>enemies.push({k:'slug',x:x*T,y:12*T-26,w:28,h:26,vx:i%2?sp:-sp,vy:0,dead:0}));\n  let bs=[40,80];if(lvl>=1)bs=bs.concat([20,60,96]);if(lvl>=2)bs=bs.concat([32,48,72,108]);\n  bs.forEach((x,i)=>enemies.push({k:'bat',x:x*T,y:7*T,x0:x*T,y0:7*T,w:28,h:22,ph:i*1.7,dead:0,vx:1}));\n  spawn();\n}\nfunction spawn(){pl={x:64,y:300,w:24,h:30,vx:0,vy:0,on:false,face:1,dead:false};cam=0;inv=0;shield=false;hud()}\nconst solid=(c,r)=>{if(c<0||c>=W)return true;if(r<0||r>=H)return false;return 'BQPU#'.includes(map[r][c])};\nfunction hitsSolid(x,y,w,h){\n  for(let r=Math.floor(y/T);r<=Math.floor((y+h-1)/T);r++)\n    for(let c=Math.floor(x/T);c<=Math.floor((x+w-1)/T);c++)if(solid(c,r))return [c,r];\n  return null;\n}\nfunction hud(){if(score>best){best=score;try{localStorage.setItem('boluBest',best)}catch(e){}}document.getElementById('bs').textContent='Best: '+best;document.getElementById('sc').textContent='Coins: '+score;document.getElementById('lv').textContent='Lives: '+lives;document.getElementById('wl').textContent='World '+(lvl+1)}\nfunction newGame(){score=0;lives=3;lvl=0;state='play';build()}\nfunction die(){if(pl.dead)return;pl.dead=true;pl.vy=-9;lives--;hud();snd(400,.5,'sawtooth',90)}\nfunction hurt(){if(inv>0||pl.dead)return;if(shield){shield=false;inv=90;snd(200,.2,'triangle',100)}else die()}\nfunction moveE(e){\n  e.x+=e.vx;\n  if(hitsSolid(e.x,e.y,e.w,e.h)){e.x-=e.vx;e.vx*=-1}\n  e.vy=Math.min(e.vy+0.5,10);e.y+=e.vy;e.on=false;\n  const h=hitsSolid(e.x,e.y,e.w,e.h);\n  if(h){if(e.vy>0){e.y=h[1]*T-e.h;e.on=true}e.vy=0}\n}\n\nfunction update(){\n  if(paused)return;\n  t++;\n  if(state!=='play'){\n    if(keys.Enter||keys.jump){keys.jump=false;keys.Enter=false;\n      if(state==='clear'){lvl++;state='play';build()}else newGame()}\n    return;\n  }\n  if(pl.dead){pl.vy+=0.5;pl.y+=pl.vy;if(pl.y>H*T+120){if(lives>0){enemies.forEach(e=>e.dead=0);spawn()}else state='over'}return}\n  if(inv>0)inv--;\n  const L=keys.ArrowLeft||keys.a||keys.left,R=keys.ArrowRight||keys.d||keys.right;\n  const J=keys[' ']||keys.ArrowUp||keys.w||keys.jump;\n  if(L){pl.vx-=0.5;pl.face=-1}else if(R){pl.vx+=0.5;pl.face=1}else pl.vx*=0.78;\n  pl.vx=Math.max(-3.6,Math.min(3.6,pl.vx));\n  if(pl.on){coy=6;combo=0}else if(coy>0)coy--;\n  if(J&&!jHeld)buf=6;jHeld=!!J;if(buf>0)buf--;\n  if(buf>0&&coy>0){pl.vy=-11.2;pl.on=false;coy=0;buf=0;snd(300,.15,'square',600)}\n  if(!J&&pl.vy<-4)pl.vy=-4;\n  pl.vy=Math.min(pl.vy+0.55,12);\n  pl.x+=pl.vx;\n  if(hitsSolid(pl.x,pl.y,pl.w,pl.h)){pl.x-=pl.vx;pl.vx=0}\n  pl.y+=pl.vy;pl.on=false;\n  const hit=hitsSolid(pl.x,pl.y,pl.w,pl.h);\n  if(hit){\n    if(pl.vy>0){pl.y=hit[1]*T-pl.h;pl.on=true}\n    else{\n      pl.y=(hit[1]+1)*T;\n      const [c,r]=hit,k=map[r][c];\n      if(k==='Q'){map[r][c]='U';score++;hud();burst(c*T+16,r*T,'#ffc928');snd(900,.2,'square',1400)}\n      else if(k==='P'){map[r][c]='U';items.push({x:c*T+4,y:r*T-28,w:24,h:24,vx:1.2,vy:-6});snd(500,.2,'triangle',800)}\n      else if(k==='B'){map[r][c]=' ';burst(c*T+16,r*T+16,'#c9743c',10);snd(150,.12,'sawtooth',60)}\n    }\n    pl.vy=0;\n  }\n  if(pl.y>H*T+40)die();\n  coins.forEach(c=>{if(!c.got&&Math.hypot(pl.x+12-c.x,pl.y+15-c.y)<22){c.got=true;score++;hud();burst(c.x,c.y,'#ffe27a',6);snd(988,.12,'square',1319)}});\n  items.forEach(b=>{if(b.got)return;moveE(b);if(Math.abs(pl.x+12-b.x-12)<20&&Math.abs(pl.y+15-b.y-12)<24){b.got=true;shield=true;burst(b.x+12,b.y+12,'#ff7aa8',10);snd(600,.3,'triangle',1200)}});\n  enemies.forEach(e=>{\n    if(e.dead){e.dead++;return}\n    if(e.k==='slug'){\n      moveE(e);\n      if(e.on){const a=e.vx<0?e.x-2:e.x+e.w+2;if(!solid(Math.floor(a/T),Math.floor((e.y+e.h+4)/T)))e.vx*=-1}\n    }else{\n      const nx=e.x0+Math.sin(t/50+e.ph)*100;e.vx=nx-e.x;e.x=nx;e.y=e.y0+Math.sin(t/20+e.ph)*18;\n    }\n    if(pl.x<e.x+e.w&&pl.x+pl.w>e.x&&pl.y<e.y+e.h&&pl.y+pl.h>e.y){\n      if(pl.vy>1&&pl.y+pl.h<e.y+e.h*0.7){e.dead=1;pl.vy=-8;combo++;const pts=2*combo;score+=pts;pops.push({x:e.x,y:e.y,t:40,s:'+'+pts});hud();burst(e.x+14,e.y+10,e.k==='slug'?'#ff9a5c':'#9b6bd6',10);snd(200,.15,'square',500)}\n      else hurt();\n    }\n  });\n  pops.forEach(p=>{p.y-=0.6;p.t--});pops=pops.filter(p=>p.t>0);\n  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.l--});parts=parts.filter(p=>p.l>0);\n  if(pl.x>123*T){state=lvl<2?'clear':'win';snd(523,.4,'triangle',1046)}\n  const tc=Math.max(0,Math.min(pl.x-VW/2+pl.face*40,W*T-VW));cam+=(tc-cam)*0.12;\n}\n\nfunction circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}\nfunction ell(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);g.fill()}\nfunction rr(x,y,w,h,r,c){g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}\nfunction eye(x,y,r,dx){circ(x,y,r,'#fff');circ(x+dx,y+1,r*0.5,'#1d2b36')}\nfunction smile(x,y,r,c){g.strokeStyle=c;g.lineWidth=2;g.lineCap='round';g.beginPath();g.arc(x,y,r,0.15*Math.PI,0.85*Math.PI);g.stroke()}\n\nfunction draw(){\n  const P=SK[lvl];\n  const gr=g.createLinearGradient(0,0,0,448);gr.addColorStop(0,P[0]);gr.addColorStop(1,P[1]);g.fillStyle=gr;g.fillRect(0,0,VW,448);\n  circ(540,70,lvl===2?24:34,['#ffe066','#ff7a45','#f3f0d0'][lvl]);if(lvl===2){g.fillStyle='#fff';for(let i=0;i<30;i++)circ((i*97)%VW,(i*53)%200,(i%3)*.5+.8,'#fff')}\n  for(let i=-1;i<8;i++){const x=i*180-(cam*0.3)%180;g.fillStyle=P[2];g.beginPath();g.arc(x+90,430,110,Math.PI,0);g.fill()}\n  for(let i=0;i<8;i++){const x=((i*260-cam*0.5)%2080+2080)%2080-100,y=50+(i%3)*30;ell(x+30,y+12,34,13,P[3]);circ(x+18,y+6,12,P[3]);circ(x+42,y+4,15,P[3])}\n  g.save();g.translate(-Math.round(cam),0);\n  const c0=Math.floor(cam/T),c1=c0+Math.ceil(VW/T)+1;\n  for(let r=0;r<H;r++)for(let c=c0;c<=c1&&c<W;c++){\n    const k=map[r][c];if(k===' ')continue;const x=c*T,y=r*T;\n    if(k==='#'){g.fillStyle='#8a5a3a';g.fillRect(x,y,T,T);circ(x+9,y+20,2,'#6d4529');circ(x+23,y+27,2,'#6d4529');\n      if(r===12||map[r-1][c]===' '){g.fillStyle='#4caf50';g.fillRect(x,y,T,6);for(let i=0;i<3;i++)circ(x+5+i*11,y+6,6,'#4caf50');circ(x+8,y+3,2,'#7fd67f')}}\n    else if(k==='B'){rr(x+1,y+1,T-2,T-2,7,'#c9743c');rr(x+4,y+4,T-8,8,4,'#e2935a');circ(x+9,y+22,2,'#8e4a22');circ(x+22,y+22,2,'#8e4a22')}\n    else if(k==='Q'||k==='P'){const b=Math.sin(t/10+c)*1.5;rr(x+1,y+1+b,T-2,T-2,9,'#f5b82e');rr(x+5,y+4+b,T-10,9,5,'#ffd868');g.fillStyle='#8e5a00';g.font='bold 18px Trebuchet MS';g.textAlign='center';g.fillText('?',x+16,y+24+b)}\n    else if(k==='U'){rr(x+1,y+1,T-2,T-2,9,'#a79a8a');rr(x+6,y+6,T-12,T-12,6,'#8c7f70')}\n  }\n  coins.forEach(c=>{if(c.got)return;const w=Math.abs(Math.cos(t/16+c.x))*9+1.5,b=Math.sin(t/12+c.x)*2;ell(c.x,c.y+b,w+2,11,'#e0a000');ell(c.x,c.y+b,w,9.5,'#ffc928');ell(c.x-w*.2,c.y+b-3,w*.35,3,'#fff6c2')});\n  const fx=123*T+8;rr(fx,5*T,5,7*T,2,'#e8eef2');circ(fx+2,5*T-6,7,'#ffc928');g.fillStyle='#ff5d73';g.beginPath();g.moveTo(fx+5,5*T+2);g.lineTo(fx+50,5*T+18);g.lineTo(fx+5,5*T+34);g.fill();circ(fx+20,5*T+18,4,'#fff');\n  items.forEach(b=>{if(b.got)return;circ(b.x+12,b.y+14,11,'#ff7aa8');circ(b.x+8,b.y+11,3,'#ffd0e0');g.fillStyle='#3fa34d';g.beginPath();g.ellipse(b.x+14,b.y+2,6,3,-0.5,0,7);g.fill()});\n  enemies.forEach(e=>{\n    if(e.dead>25)return;\n    const sq=e.dead?0.4:1,f=e.vx<0?-1:1;\n    if(e.k==='slug'){\n      const cx=e.x+14,by=e.y+e.h;\n      ell(cx,by-10*sq,15,11*sq+1,'#ff9a5c');ell(cx-3,by-14*sq,7,4*sq+.5,'#ffbf8f');\n      if(!e.dead){g.strokeStyle='#d9743a';g.lineWidth=2;g.beginPath();g.moveTo(cx-6,by-16);g.lineTo(cx-8,by-24);g.moveTo(cx+6,by-16);g.lineTo(cx+8,by-24);g.stroke();\n        eye(cx-8,by-26,4.5,f*1.5);eye(cx+8,by-26,4.5,f*1.5);circ(cx-9,by-8,3,'#ff6f8f');circ(cx+9,by-8,3,'#ff6f8f');smile(cx,by-14,5,'#7a2e0a')}\n    }else{\n      const cx=e.x+14,cy=e.y+11,fl=Math.sin(t/4)*9;\n      ell(cx-15,cy-3+fl*.4,11,6+Math.abs(fl)*.4,'#7a4bbd');ell(cx+15,cy-3+fl*.4,11,6+Math.abs(fl)*.4,'#7a4bbd');\n      ell(cx,cy,13,11*sq+1,'#9b6bd6');circ(cx-9,cy-9*sq,4,'#9b6bd6');circ(cx+9,cy-9*sq,4,'#9b6bd6');\n      if(!e.dead){eye(cx-5,cy-2,3.5,f);eye(cx+5,cy-2,3.5,f);g.fillStyle='#fff';g.fillRect(cx-4,cy+4,2,3);g.fillRect(cx+2,cy+4,2,3)}\n    }\n  });\n  if(!pl.dead&&inv>0&&Math.floor(t/4)%2===0){}else{\n    const x=pl.x,y=pl.y,f=pl.face,cx=x+12,run=pl.on&&Math.abs(pl.vx)>0.5?Math.sin(t/3)*3:0;\n    ell(cx-6+run,y+28,6,3.5,'#1d2b36');ell(cx+6-run,y+28,6,3.5,'#1d2b36');\n    g.strokeStyle='#1d2b36';g.lineWidth=2;g.beginPath();g.moveTo(cx,y);g.lineTo(cx+f*3,y-8);g.stroke();circ(cx+f*3,y-9,4,'#ff5d73');\n    ell(cx,y+14,14,15,'#2bb5a6');ell(cx-3,y+7,8,4,'#5fd8ca');\n    eye(cx-5+f*1,y+11,5,f*2);eye(cx+6+f*1,y+11,5,f*2);\n    circ(cx-10,y+19,3,'#ff8aa8');circ(cx+10,y+19,3,'#ff8aa8');smile(cx+f,y+15,4,'#1d2b36');\n    if(shield){g.strokeStyle='rgba(120,220,255,.9)';g.lineWidth=3;g.beginPath();g.arc(cx,y+14,24,0,7);g.stroke();g.fillStyle='rgba(120,220,255,.2)';g.fill()}\n  }\n  parts.forEach(p=>{g.globalAlpha=p.l/30;circ(p.x,p.y,3,p.c)});g.globalAlpha=1;\n  g.font='bold 18px Trebuchet MS, Verdana, sans-serif';g.textAlign='center';g.lineWidth=4;g.strokeStyle='#1d2b36';pops.forEach(p=>{g.strokeText(p.s,p.x+14,p.y);g.fillStyle='#ffe066';g.fillText(p.s,p.x+14,p.y)});\n  g.restore();\n  if(state!=='play'){\n    g.fillStyle='rgba(16,23,29,.72)';g.fillRect(0,0,VW,448);g.fillStyle='#fff';g.textAlign='center';\n    g.font='bold 34px Trebuchet MS, Verdana, sans-serif';\n    g.fillText(state==='clear'?'World cleared!':state==='win'?'You beat all 3 worlds!':'Game over',VW/2,190);\n    g.font='20px Trebuchet MS, Verdana, sans-serif';g.fillText('Coins collected: '+score,VW/2,230);\n    g.fillText(state==='clear'?'Press Enter or tap \u25b2 for the next world':'Press Enter or tap \u25b2 to play again',VW/2,268);\n  }\n}\nfunction loop(){update();draw();if(paused){g.fillStyle='rgba(16,23,29,.6)';g.fillRect(0,0,VW,448);g.fillStyle='#fff';g.textAlign='center';g.font='bold 32px Trebuchet MS, Verdana, sans-serif';g.fillText('Paused (press P)',VW/2,230)}requestAnimationFrame(loop)}\naddEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='p'||e.key==='P')paused=!paused;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});\naddEventListener('keyup',e=>{keys[e.key]=false});\n[['bl','left'],['br','right'],['bj','jump']].forEach(([id,k])=>{\n  const b=document.getElementById(id),on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};\n  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);\n});\nnewGame();loop();\n<\/script>\n<\/body>\n<\/html>\n", "racer": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Cute Racer<\/title>\n<style>\n:root{--panel:rgba(255,255,255,.88);--ink:#1d2b36;--btn:rgba(29,43,54,.78);--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--panel:rgba(20,28,34,.86);--ink:#e8eef2;--btn:rgba(232,238,242,.75);--btnink:#10171d}}\n:root[data-theme=\"dark\"]{--panel:rgba(20,28,34,.86);--ink:#e8eef2;--btn:rgba(232,238,242,.75);--btnink:#10171d}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nhtml,body{height:100%;margin:0;overflow:hidden;background:#bfe3ff;font-family:\"Trebuchet MS\",Verdana,sans-serif}\n#gl{position:fixed;inset:0;width:100%;height:100%;display:block}\n.box{position:fixed;background:var(--panel);color:var(--ink);border-radius:16px;padding:8px 14px}\n#hud{left:12px;top:calc(12px + env(safe-area-inset-top,0px))}\n#spd{font-size:2.2rem}\n#info{font-size:1rem;line-height:1.4}\n#mm{right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:4px;line-height:0}\n#mm canvas{width:130px;height:130px;border-radius:12px}\n#msg{left:50%;top:32%;transform:translate(-50%,-50%);font-size:3rem;font-weight:bold;text-align:center;background:none;color:#fff;text-shadow:0 3px 0 #1d2b36,0 0 12px #1d2b36;pointer-events:none;white-space:pre-line}\n#help{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:.8rem;text-align:center;max-width:92vw}\n.pad{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}\n.pad button{width:68px;height:68px;border:0;border-radius:34px;font-size:1.4rem;background:var(--btn);color:var(--btnink);touch-action:none;user-select:none}\n.pad button:focus-visible{outline:3px solid #f5a524}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"gl\"><\/canvas>\n<div class=\"box\" id=\"hud\"><b id=\"spd\">0<\/b> km/h<div id=\"info\"><\/div><\/div>\n<div class=\"box\" id=\"mm\"><canvas id=\"mmc\" width=\"130\" height=\"130\"><\/canvas><\/div>\n<div class=\"box\" id=\"msg\"><\/div>\n<div class=\"pad\" style=\"left:12px\"><button id=\"bl\" aria-label=\"Steer left\">\u25c0<\/button><button id=\"br\" aria-label=\"Steer right\">\u25b6<\/button><\/div>\n<div class=\"pad\" style=\"right:12px\"><button id=\"bb\" aria-label=\"Brake\">\u25a0<\/button><button id=\"bg\" aria-label=\"Gas\">\u25b2<\/button><\/div>\n<div class=\"box\" id=\"help\">W/\u2191 gas, S/\u2193 brake, A/D or \u2190/\u2192 steer, Space handbrake, R restart. Win 3 laps!<\/div>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\nconst V3=THREE.Vector3,LAPS=3,W=24,N=500;\nconst rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];\nconst ren=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true});\nren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;\nconst scene=new THREE.Scene(),cam=new THREE.Perspective ound=mesh(new THREE.PlaneGeometry(5000,5000),mat('#ffffff',{map:grassTex}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);\nfor(let i=0;i<30;i++){const p=mesh(new THREE.CircleGeometry(rnd(40,110),24),mat(pick(['#72c75f','#8ddc78','#86cf6a'])),rnd(-900,900),.02,rnd(-900,900));p.rotation.x=-Math.PI/2;scene.add(p)}\nfunction tex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}\nconst roadTex=tex(128,256,g=>{g.fillStyle='#4a4f57';g.fillRect(0,0,128,256);for(let i=0;i<500;i++){g.fillStyle=Math.random()<.5?'#54595f':'#43474e';g.fillRect(Math.random()*128,Math.random()*256,2,2)}\n  for(let i=0;i<8;i++){g.fillStyle=i%2?'#fff':'#e63946';g.fillRect(0,i*32,8,32);g.fillRect(120,i*32,8,32)}\n  g.fillStyle='#fff';g.fillRect(61,0,6,110);g.fillRect(14,0,3,256);g.fillRect(111,0,3,256)});\nfunction ribbon(w,y,m,vs){\n  const pos=[],uv=[],nor=[],idx=[];\n  for(let i=0;i<=N;i++){const p=P[i],t=Tg[i],sx=t.z,sz=-t.x,v=i/N*LEN/vs;\n    pos.push(p.x-sx*w/2,y,p.z-sz*w/2,p.x+sx*w/2,y,p.z+sz*w/2);uv.push(0,v,1,v);nor.push(0,1,0,0,1,0);\n    if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}\n  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setIndex(idx);\n  const o=new THREE.Mesh(g,m);o.receiveShadow=true;scene.add(o)}\nribbon(W+16,.04,mat('#e8d9a2',{side:2}),40);\nribbon(W,.07,mat('#fff',{map:roadTex,side:2}),40);\nconst distTrack=(x,z)=>{let m=1e9;for(let i=0;i<N;i+=2){const d=Math.hypot(P[i].x-x,P[i].z-z);if(d<m)m=d}return m};\nconst sideAt=(u,off)=>{const p=curve.getPointAt(u),t=curve.getTangentAt(u);return new V3(p.x+t.z*off,0,p.z-t.x*off)};\nconst LAKE={x:-60,z:20,r:70},SPOT=[];\n\n// lake\nconst lake=mesh(new THREE.CircleGeometry(LAKE.r,40),new THREE.MeshPhongMaterial({color:'#4db8ea',shininess:120,specular:0xffffff}),LAKE.x,.06,LAKE.z);lake.rotation.x=-Math.PI/2;scene.add(lake);\nconst shore=mesh(new THREE.RingGeometry(LAKE.r,LAKE.r+7,40),mat('#eedfa8'),LAKE.x,.05,LAKE.z);shore.rotation.x=-Math.PI/2;scene.add(shore);\n\n// ---------- landmarks ----------\nfunction clockTex(){return tex(128,128,g=>{g.fillStyle='#fffbe8';g.fillRect(0,0,128,128);g.strokeStyle='#333';g.lineWidth=6;g.beginPath();g.arc(64,64,58,0,7);g.stroke();g.lineWidth=4;for(let i=0;i<12;i++){const a=i/12*6.283;g.beginPath();g.moveTo(64+Math.sin(a)*46,64-Math.cos(a)*46);g.lineTo(64+Math.sin(a)*54,64-Math.cos(a)*54);g.stroke()}g.lineWidth=6;g.beginPath();g.moveTo(64,64);g.lineTo(64,28);g.moveTo(64,64);g.lineTo(88,74);g.stroke()})}\nfunction tower(x,z){\n  const g=new THREE.Group();g.add(BOX(8,24,8,'#dfb48f',0,0,0),BOX(10,2.5,10,'#b5543a',0,24,0),BOX(8.4,8,8.4,'#ecd2b0',0,26.5,0));\n  const cm=new THREE.MeshBasicMaterial({map:clockTex()});\n  [[0,4.3,0],[0,-4.3,Math.PI],[4.3,0,Math.PI/2],[-4.3,0,-Math.PI/2]].forEach(([fx,fz,ry])=>{const f=mesh(new THREE.CircleGeometry(3,24),cm,fx,30.5,fz);f.rotation.y=ry;g.add(f)});\n  const roof=mesh(new THREE.ConeGeometry(6.5,9,4),mat('#b5543a'),0,39,0);roof.rotation.y=Math.PI/4;g.add(roof,CYL(.2,.2,4,'#d4a62a',0,43.5,0,8));\n  g.position.set(x,0,z);scene.add(g);SPOT.push([x,z,14])}\nfunction shrine(x,z){\n  const g=new THREE.Group(),blue='#2f86d0',cream='#f6eed9';\n  g.add(BOX(24,3,24,'#e8dcc0',0,0,0),CYL(8.5,8.5,10,cream,0,3,0,8),SPH(9,blue,0,13,0,true),CYL(.4,.4,5,'#d4a62a',0,21,0,8));\n  g.add(mesh(new THREE.TorusGeometry(8.6,.7,8,24),mat(blue),0,12.8,0));g.children[g.children.length-1].rotation.x=Math.PI/2;\n  [[-11,-11],[11,-11],[-11,11],[11,11]].forEach(([mx,mz])=>g.add(CYL(1.3,1.5,15,cream,mx,3,mz,12),SPH(1.8,blue,mx,18,mz,true),CYL(.15,.15,2.5,'#d4a62a',mx,19.5,mz,6)));\n  g.position.set(x,0,z);scene.add(g);SPOT.push([x,z,26])}\ntower(sideAt(.08,48).x,sideAt(.08,48).z);shrine(70,40);\n// start line, arch, grandstand\n(function(){\n  const p=P[0],t=Tg[0],ry=Math.atan2(t.x,t.z),g=new THREE.Group();\n  const chk=tex(64,16,c=>{for(let i=0;i<8;i++)for(let j=0;j<2;j++){c.fillStyle=(i+j)%2?'#fff':'#111';c.fillRect(i*8,j*8,8,8)}});\n  const strip=mesh(new THREE.PlaneGeometry(W,3),new THREE.MeshBasicMaterial({map:chk}),0,.1,0);strip.rotation.x=-Math.PI/2;g.add(strip);\n  const beam=mesh(new THREE.BoxGeometry(W+6,3,1.2),new THREE.MeshBasicMaterial({map:chk}),0,13.5,0);g.add(beam,CYL(1,1,13,'#e63946',-W/2-1.5,0,0,12),CYL(1,1,13,'#e63946',W/2+1.5,0,0,12));\n  [0,1,2].forEach(i=>g.add(BOX(3.5,2.4+i*2.4,46,['#ff6b6b','#ffd166','#4ecdc4'][i],W/2+14+i*3.5,0,0)));\n  g.position.set(p.x,0,p.z);g.rotation.y=ry;scene.add(g);\n})();\n\n// ---------- scenery (rounded, recognisable shapes) ----------\nconst q=new THREE.Quaternion(),e=new THREE.Euler(),m4=new THREE.Matrix4();\nfunction inst(geo,m,n){const o=new THREE.InstancedMesh(geo,m,n);scene.add(o);return o}\nfunction put(o,i,x,y,z,sx,sy,sz,ry=0,col){q.setFromEuler(e.set(0,ry,0));m4.compose(new V3(x,y,z),q,new V3(sx,sy,sz));o.setMatrixAt(i,m4);if(col)o.setColorAt(i,new THREE.Color(col))}\nconst free=(x,z,r)=>distTrack(x,z)>W/2+r&&Math.hypot(x-LAKE.x,z-LAKE.z)>LAKE.r+14&&SPOT.every(s=>Math.hypot(x-s[0],z-s[1])>s[2]+r);\nconst NT=380,trunk=inst(new THREE.CylinderGeometry(.35,.5,1,8),mat('#8b5a35'),NT),crown=inst(new THREE.IcosahedronGeometry(1,2),mat('#ffffff'),NT*2);\nlet nt=0,nc=0;const greens=['#4fb356','#62c95c','#3e9e4c','#78d468','#8fdc6f'];\nfor(let i=0;i<4000&&nt<NT;i++){const x=rnd(-750,750),z=rnd(-750,750);if(!free(x,z,26))continue;const s=rnd(2.2,4);\n  put(trunk,nt,x,s*.6,z,s*.5,s*1.2,s*.5);put(crown,nc++,x,s*1.9,z,s*1.5,s*1.3,s*1.5,rnd(0,6),pick(greens));put(crown,nc++,x+rnd(-.5,.5),s*2.9,z,s*.95,s*.9,s*.95,0,pick(greens));nt++}\ntrunk.count=nt;crown.count=nc;\nconst NB=170,bush=inst(new THREE.IcosahedronGeometry(1,1),mat('#ffffff'),NB);\nfor(let i=0;i<NB;i++){const u=i/NB,p=sideAt(u,(i%2?1:-1)*(W/2+rnd(14,30 <section class=\"flex-1 flex flex-col bg-studio-950 p-3 sm:p-5 justify-between border-b lg:border-b-0 lg:border-r border-zinc-800 relative\">\n            \n            <!-- Quick Add Media, Add Icon / Pic & Song Bar -->\n            <div class=\"flex flex-wrap items-center justify-between gap-2 mb-3\">\n                <div class=\"flex flex-wrap items-center gap-2\">\n                    <!-- 1. Add Videos / Photos -->\n                    <label class=\"cursor-pointer bg-studio-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-100 text-xs sm:text-sm font-medium px-3 py-2 rounded-xl flex items-center gap-1.5 transition active:scale-95\">\n                        <i data-lucide=\"plus-circle\" class=\"w-4 h-4 text-indigo-400\"><\/i>\n                        <span>+ Videos / Photos<\/span>\n                        <input type=\"file\" id=\"mediaInput\" accept=\"video/*,image/*\" multiple class=\"hidden\">\n                    <\/label>\n\n                    <!-- 2. Add Icon / Pic Overlay Button (Opens file picker immediately) -->\n                    <label class=\"cursor-pointer bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/50 text-emerald-200 text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow-sm transition active:scale-95\" title=\"Video ke upar lagane ke liye Icon ya Pic select karein\">\n                        <i data-lucide=\"sticker\" class=\"w-4 h-4 text-emerald-400\"><\/i>\n                        <span>Add Icon / Pic<\/span>\n                        <input type=\"file\" id=\"iconOverlayInput\" accept=\"image/*\" class=\"hidden\">\n                    <\/label>\n\n                    <!-- 3. Add Background Song -->\n                    <label class=\"cursor-pointer bg-studio-800 hover:bg-zinc-700 border border-pink-500/40 text-pink-100 text-xs sm:text-sm font-medium px-3 py-2 rounded-xl flex items-center gap-1.5 transition active:scale-95\">\n                        <i data-lucide=\"music\" class=\"w-4 h-4 text-pink-400\"><\/i>\n                        <span id=\"songBtnLabel\">Add Song<\/span>\n                        <input type=\"file\" id=\"audioInput\" accept=\"audio/*\" class=\"hidden\">\n                    <\/label>\n                <\/div>\n\n                <!-- Sample Demo Button -->\n                <button id=\"loadDemoBtn\" class=\"text-xs text-zinc-400 hover:text-indigo-400 underline underline-offset-2 px-2 py-1\">\n                    Load Demo Clips\n                <\/button>\n            <\/div>\n\n            <!-- Video Canvas Container with Floating Side Undo/Redo Arrows -->\n            <div id=\"canvasWrapper\" class=\"relative flex-1 min-h-[260px] sm:min-h-[350px] bg-black rounded-2xl border border-zinc-800/80 flex items-center justify-center overflow-hidden shadow-2xl touch-none\">\n                <canvas id=\"previewCanvas\" class=\"max-w-full max-h-full object-contain cursor-default\"><\/canvas>\n                \n                <!-- Empty State Overlay -->\n                <div id=\"emptyState\" class=\"absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-studio-900/90 pointer-events-auto\">\n                    <div class=\"w-14 h-14 rounded-2xl bg-studio-800 border border-zinc-700 flex items-center justify-center mb-3 text-indigo-400\">\n                        <i data-lucide=\"clapperboard\" class=\"w-7 h-7\"><\/i>\n                    <\/div>\n                    <h2 class=\"text-base sm:text-lg font-semibold text-white\">Apni Videos, Photos aur Icons Jorein<\/h2>\n                    <p class=\"text-xs sm:text-sm text-zinc-400 max-w-md mt-1\">\n                        Upar <span class=\"text-indigo-400 font-medium\">\"+ Videos / Photos\"<\/span> se clips jorein, <span class=\"text-emerald-400 font-medium\">\"Add Icon / Pic\"<\/span> se video par logo/tasveer lagayein, aur <span class=\"text-pink-400 font-medium\">\"Add Song\"<\/span> se sad song lagayein.\n                    <\/p>\n                <\/div>\n\n                <!-- Live Audio Balance Badge -->\n                <div id=\"liveAudioBadge\" class=\"hidden absolute top-3 left-3 bg-black/75 backdrop-blur-md border border-zinc-700/70 rounded-lg px-2.5 py-1 text-[11px] text-zinc-300 flex items-center gap-2 pointer-events-none\">\n                    <span class=\"w-2 h-2 rounded-full bg-emerald-400 animate-pulse\"><\/span>\n                    <span id=\"badgeText\">Original: 100% | Song: 20%<\/span>\n                <\/div>\n\n                <!-- Floating Side Undo / Redo Quick Arrows (Always accessible on the side) -->\n                <div class=\"absolute right-3 top-1/2 -translate-y-1/2 flex flex-col gap-2 z-20\">\n                    <button id=\"sideUndoBtn\" disabled class=\"w-9 h-9 rounded-full bg-zinc-900/85 hover:bg-zinc-800 border border-zinc-700 text-amber-400 flex items-center justify-center shadow-lg backdrop-blur-md disabled:opacity-30 disabled:pointer-events-none transition active:scale-90\" title=\"Peeche (Undo)\">\n                        <i data-lucide=\"arrow-left\" class=\"w-4 h-4\"><\/i>\n                    <\/button>\n                    <button id=\"sideRedoBtn\" disabled class=\"w-9 h-9 rounded-full bg-zinc-900/85 hover:bg-zinc-800 border border-zinc-700 text-sky-400 flex items-center justify-center shadow-lg backdrop-blur-md disabled:opacity-30 disabled:pointer-events-none transition active:scale-90\" title=\"Aage (Redo)\">\n                        <i data-lucide=\"arrow-right\" class=\"w-4 h-4\"><\/i>\n                    <\/button>\n                <\/div>\n            <\/div>\n\n            <!-- INTERACTIVE ICON / PIC POSITION & SIZE BAR + \"DONE\" BUTTON -->\n            <div id=\"overlayEditBar\" class=\"hidden mt-3 bg-emerald-950/60 border border-emerald-500/50 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-lg\">\n                <div class=\"flex items-center gap-2.5\">\n                    <div class=\"w-8 h-8 rounded-lg bg-emerald-500/20
