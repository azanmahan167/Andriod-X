  <!-- Playback Scrubber & Controls -->\n            <div class=\"mt-3 bg-studio-900 border border-zinc-800 rounded-2xl p-3\">\n                <div class=\"flex items-center gap-3 mb-2\">\n                    <span id=\"currentTimeDisplay\" class=\"text-xs font-mono text-zinc-300 w-12\">00:00<\/span>\n                    <input type=\"range\" id=\"seekSlider\" min=\"0\" max=\"100\" step=\"0.05\" value=\"0\" class=\"flex-1\">\n                    <span id=\"totalTimeDisplay\" class=\"text-xs font-mono text-zinc-400 w-12 text-right\">00:00<\/span>\n                <\/div>\n\n                <div class=\"flex items-center justify-between flex-wrap gap-2\">\n                    <div class=\"flex items-center gap-2\">\n                        <button id=\"restartBtn\" class=\"p-2 rounded-xl bg-studio-800 hover:bg-zinc-700 text-zinc-300 transition\" title=\"Start se chalayein\">\n                            <i data-lucide=\"skip-back\" class=\"w-4 h-4\"><\/i>\n                        <\/button>\n                        <button id=\"playPauseBtn\" class=\"px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm flex items-center gap-2 shadow-md transition active:scale-95\">\n                            <i data-lucide=\"play\" id=\"playIcon\" class=\"w-4 h-4 fill-current\"><\/i>\n                            <span id=\"playText\">Play<\/span>\n                        <\/button>\n                    <\/div>\n\n                    <!-- Simple Editing Toolbar -->\n                    <div class=\"flex items-center gap-1.5 sm:gap-2\">\n                        <button id=\"splitBtn\" class=\"px-3 py-2 rounded-xl bg-studio-800 hover:bg-zinc-700 border border-zinc-700 text-xs font-medium text-zinc-200 flex items-center gap-1.5 transition active:scale-95 disabled:opacity-40\" title=\"Playhead ki jagah se clip ke 2 hissay karein\">\n                            <i data-lucide=\"scissors\" class=\"w-3.5 h-3.5 text-amber-400\"><\/i>\n                            <span>Split<\/span>\n                        <\/button>\n                        <button id=\"moveLeftBtn\" class=\"p-2 rounded-xl bg-studio-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 transition disabled:opacity-40\" title=\"Clip peeche karein\">\n                            <i data-lucide=\"chevron-left\" class=\"w-4 h-4\"><\/i>\n                        <\/button>\n                        <button id=\"moveRightBtn\" class=\"p-2 rounded-xl bg-studio-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 transition disabled:opacity-40\" title=\"Clip aage karein\">\n                            <i data-lucide=\"chevron-right\" class=\"w-4 h-4\"><\/i>\n                        <\/button>\n                        <button id=\"deleteClipBtn\" class=\"px-3 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-xs font-medium text-red-400 flex items-center gap-1.5 transition active:scale-95 disabled:opacity-40\" title=\"Selected clip delete karein\">\n                            <i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5\"><\/i>\n                            <span class=\"hidden sm:inline\">Delete<\/span>\n                        <\/button>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/section>\n\n        <!-- Right Panel: Audio Balance Mixer (Drama Mode), Fixed Icons List & Clip Trim Tools -->\n        <aside class=\"w-full lg:w-[390px] bg-studio-900 p-4 sm:p-5 flex flex-col gap-4 overflow-y-auto\">\n            \n            <!-- AUDIO BALANCE / VOLUME MIXER CARD -->\n            <div id=\"audioMixerCard\" class=\"bg-studio-800/90 border border-zinc-700/80 rounded-2xl p-4 shadow-lg\">\n                <div class=\"flex items-center justify-between mb-2\">\n                    <div class=\"flex items-center gap-2\">\n                        <div class=\"p-1.5 rounded-lg bg-pink-500/20 text-pink-400\">\n                            <i data-lucide=\"sliders\" class=\"w-4 h-4\"><\/i>\n                        <\/div>\n                        <div>\n                            <h3 class=\"text-sm font-bold text-white\">Awaz Balance (Audio Mixer)<\/h3>\n                            <p class=\"text-[11px] text-zinc-400\">Kis ki awaz zyada aani chahiye?<\/p>\n                        <\/div>\n                    <\/div>\n                <\/div>\n\n                <!-- 1-Click Emotional Drama Preset -->\n                <button id=\"dramaPresetBtn\" class=\"w-full mt-2 mb-4 py-2.5 px-3 rounded-xl bg-gradient-to-r from-pink-600/90 to-purple-600/90 hover:from-pink-500 hover:to-purple-500 text-white text-xs font-semibold flex items-center justify-center gap-2 shadow-md shadow-pink-600/20 transition active:scale-98\">\n                    <i data-lucide=\"sparkles\" class=\"w-4 h-4\"><\/i>\n                    <span>Emotional Drama Mode (Original 100% + Halka Song 18%)<\/span>\n                <\/button>\n\n                <!-- Original Video Sound Slider -->\n                <div class=\"mb-4 bg-studio-900/80 p-3 rounded-xl border border-zinc-800\">\n                    <div class=\"flex justify-between items-center mb-1.5\">\n                        <span class=\"text-xs font-semibold text-indigo-300 flex items-center gap-1.5\">\n                            <i data-lucide=\"mic\" class=\"w-3.5 h-3.5\"><\/i>\n                            Original Video Awaz (Dialogues)\n                        <\/span>\n                        <span id=\"origVolLabel\" class=\"text-xs font-mono font-bold text-white bg-indigo-500/20 px-2 py-0.5 rounded\">100%<\/span>\n                    <\/div>\n                    <input type=\"range\" id=\"origVolSlider\" min=\"0\" max=\"150\" value=\"100\" class=\"w-full\">\n                    <div class=\"flex justify-between gap-1.5 mt-2\">\n                        <button type=\"button\" onclick=\"setOrigVol(0, true)\" class=\"flex-1 text-[10px] py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300\">Mute (0%)<\/button>\n                        <button type=\"button\" onclick=\"setOrigVol(100, true)\" class=\"flex-1 text-[10px] py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-indigo-300\">Clear Voice (100%)<\/button>\n                        <button type=\"button\" onclick=\"setOrigVol(140, true)\" class=\"flex-1 text-[10px] py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300\">Boost (140%)<\/button>\n                    <\/div>\n                <\/div>\n\n                <!-- Background Song Slider -->\n                <div class=\"bg-studio-900/80 p-3 rounded-xl border border-zinc-800\">\n                    <div class=\"flex justify-between items-center mb-1.5\">\n                        <span class=\"text-xs font-semibold text-pink-300 flex items-center gap-1.5\">\n                            <i data-lucide=\"music-2\" class=\"w-3.5 h-3.5\"><\/i>\n                            Background Song Awaz\n                        <\/span>\n                        <span id=\"bgVolLabel\" class=\"text-xs font-mono font-bold text-white bg-pink-500/20 px-2 py-0.5 rounded\">20%<\/span>\n                    <\/div>\n                    <input type=\"range\" id=\"bgVolSlider\" min=\"0\" max=\"100\" value=\"20\" class=\"w-full drama-slider\">\n                    <div class=\"flex justify-between gap-1.5 mt-2\">\n                        <button type=\"button\" onclick=\"setBgVol(15, true)\" class=\"flex-1 text-[10px] py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-pink-300\">Halka Sad (15%)<\/button>\n                        <button type=\"button\" onclick=\"setBgVol(45, true)\" class=\"flex-1 text-[10px] py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300\">Medium (45%)<\/button>\n                        <button type=\"button\" onclick=\"setBgVol(90, true)\" class=\"flex-1 text-[10px] py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300\">Song Tez (90%)<\/button>\n                    <\/div>\n\n                    <!-- Loaded Song Info & Controls -->\n                    <div id=\"bgSongInfo\" class=\"mt-3 pt-2.5 border-t border-zinc-800/80 flex items-center justify-between text-xs\">\n                        <span id=\"bgSongName\" class=\"text-zinc-400 truncate max-w-[180px]\">Koi background song nahi laga<\/span>\n                        <div class=\"flex items-center gap-2\">\n                            <label class=\"flex items-center gap-1 text-[11px] text-zinc-400 cursor-pointer\">\n                                <input type=\"checkbox\" id=\"loopSongCheck\" checked class=\"rounded accent-pink-500\">\n                                <span>Loop<\/span>\n                            <\/label>\n                            <button id=\"removeSongBtn\" class=\"hidden text-red-400 hover:text-red-300 text-[11px] underline\">Remove<\/button>\n                        <\/div>\n                    <\/div>\n                <\/div>\n            <\/div>\n\n            <!-- ADDED ICONS / OVERLAY PICS LIST -->\n            <div class=\"bg-studio-800/90 border border-zinc-700/80 rounded-2xl p-4\">\n                <div class=\"flex items-center justify-between mb-2\">\n                    <div class=\"flex items-center gap-2\">\n                        <div class=\"p-1.5 rounded-lg bg-emerald-500/20 text-emerald-400\">\n                            <i data-lucide=\"sticker\" class=\"w-4 h-4\"><\/i>\n                        <\/div>\n                        <div>\n                            <h3 class=\"text-sm font-bold text-white\">Video Par Lagi Pics / Icons<\/h3>\n                            <p class=\"text-[11px] text-zinc-400\">Dubara edit karne ke liye click karein<\/p>\n                        <\/div>\n                    <\/div>\n                    <label class=\"cursor-pointer text-[11px] bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-lg font-medium\">\n                        + Add Icon\n                        <input type=\"file\" id=\"iconOverlayInput2\" accept=\"image/*\" class=\"hidden\">\n                    <\/label>\n                <\/div>\n                <div id=\"overlaysList\" class=\"space-y-1.5 max-h-32 overflow-y-auto mt-2\">\n                    <p class=\"text-[11px] text-zinc-500 text-center py-2\">Abhi koi icon ya pic video par nahi lagayi gayi<\/p>\n                <\/div>\n            <\/div>\n\n            <!-- SELECTED CLIP CUT / TRIM / DURATION CONTROLS -->\n            <div class=\"bg-studio-800/90 border border-zinc-700/80 rounded-2xl p-4\">\n                <div class=\"flex items-center gap-2 mb-3\">\n                    <div class=\"p-1.5 rounded-lg bg-amber-500/20 text-amber-400\">\n                        <i data-lucide=\"crop\" class=\"w-4 h-4\"><\/i>\n                    <\/div>\n                    <div>\n                        <h3 class=\"text-sm font-bold text-white\">Clip Cut / Trim & Photo Time<\/h3>\n                        <p class=\"text-[11px] text-zinc-400\" id=\"selectedClipTitle\">Timeline se koi clip select karein<\/p>\n                    <\/div>\n                <\/div>\n\n                <div id=\"clipControlsBody\" class=\"space-y-3 opacity-50 pointer-events-none\">\n                    <!-- Photo Duration Control (Shown for Images) -->\n                    <div id=\"photoDurationBox\" class=\"hidden bg-studio-900/80 p-3 rounded-xl border border-zinc-800\">\n                        <div class=\"flex justify-between text-xs mb-1\">\n                            <span class=\"text-zinc-300\">Photo Kitni Der Dikhe (Seconds)<\/span>\n                            <span id=\"photoDurVal\" class=\"font-mono text-indigo-400 font-semibold\">3.0s<\/span>\n                        <\/div>\n                        <input type=\"range\" id=\"photoDurSlider\" min=\"1\" max=\"15\" step=\"0.5\" value=\"3\" class=\"w-full\">\n                    <\/div>\n\n                    <!-- Video Trim Start & End (Shown for Videos) -->\n                    <div id=\"videoTrimBox\" class=\"space-y-2.5 bg-studio-900/80 p-3 rounded-xl border border-zinc-800\">\n                        <div>\n                            <div class=\"flex justify-between text-xs mb-1\">\n                                <span class=\"text-zinc-300\">Start Cut (Shuru se kaatein)<\/span>\n                                <span id=\"trimStartVal\" class=\"font-mono text-amber-400\">0.0s<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"trimStartSlider\" min=\"0\" max=\"10\" step=\"0.1\" value=\"0\" class=\"w-full\">\n                        <\/div>\n                        <div>\n                            <div class=\"flex justify-between text-xs mb-1\">\n                                <span class=\"text-zinc-300\">End Cut (Aakhir se kaatein)<\/span>\n                                <span id=\"trimEndVal\" class=\"font-mono text-amber-400\">10.0s<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"trimEndSlider\" min=\"0\" max=\"10\" step=\"0.1\" value=\"10\" class=\"w-full\">\n                        <\/div>\n                    <\/div>\n\n                    <!-- Smooth Fade Transition Toggle -->\n                    <label class=\"flex items-center justify-between bg-studio-900/80 p-2.5 rounded-xl border border-zinc-800 cursor-pointer\">\n                        <span class=\"text-xs text-zinc-300\">Smooth Fade Transition<\/span>\n                        <input type=\"checkbox\" id=\"fadeToggle\" checked class=\"w-4 h-4 accent-indigo-500 rounded\">\n                    <\/label>\n                <\/div>\n            <\/div>\n        <\/aside>\n    <\/main>\n\n    <!-- Bottom Visual Multi-Track Timeline -->\n    <footer class=\"bg-studio-900 border-t border-zinc-800 p-3 sm:p-4\">\n        <div class=\"flex items-center justify-between mb-2\">\n            <div class=\"flex items-center gap-2\">\n                <span class=\"text-xs font-semibold uppercase tracking-wider text-zinc-400\">Timeline Track (Videos + Photos)<\/span>\n                <span id=\"clipCountBadge\" class=\"text-[11px] bg-studio-800 text-zinc-300 px-2 py-0.5 rounded-full border border-zinc-700\">0 Clips<\/span>\n            <\/div>\n            <span class=\"text-[11px] text-zinc-400 hidden sm:inline\">Tip: Clip par click karke Split ya Cut karein<\/span>\n        <\/div>\n\n        <!-- Horizontal Clips Strip -->\n        <div id=\"timelineContainer\" class=\"flex items-center gap-2 overflow-x-auto pb-2 min-h-[76px] bg-studio-950/80 p-2 rounded-xl border border-zinc-800/90\">\n            <div class=\"text-xs text-zinc-500 w-full text-center py-4\">\n                Yahan aap ki jori hui videos aur photos nazar aayengi...\n            <\/div>\n        <\/div>\n\n        <!-- Background Audio Strip Visualization -->\n        <div class=\"mt-2 flex items-center gap-2\">\n            <div class=\"w-24 shrink-0 text-[11px] font-medium text-pink-400 flex items-center gap-1\">\n                <i data-lucide=\"music\" class=\"w-3 h-3\"><\/i>\n                <span>BG Song:<\/span>\n            <\/div>\n            <div id=\"bgTrackBar\" class=\"flex-1 h-7 rounded-lg bg-studio-950 border border-zinc-800 flex items-center px-3 overflow-hidden relative\">\n                <div id=\"bgTrackFill\" class=\"hidden h-5 rounded bg-pink-500/25 border border-pink-500/50 flex items-center px-2 text-[11px] text-pink-200 truncate transition-all duration-150\" style=\"width: 100%;\">\n                    <span id=\"bgTrackText\">Sad_Song.mp3 (Halka Background - 20%)<\/span>\n                <\/div>\n                <span id=\"bgTrackEmpty\" class=\"text-[11px] text-zinc-600\">Koi background song select nahi kiya gaya<\/span>\n            <\/div>\n        <\/div>\n    <\/footer>\n\n    <!-- Modal: Audio Balance Prompt -->\n    <div id=\"audioPromptModal\" class=\"hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4\">\n        <div class=\"bg-studio-900 border border-zinc-700 rounded-2xl max-w-md w-full p-5 shadow-2xl\">\n            <div class=\"flex items-center gap-3 mb-3\">\n                <div class=\"w-10 h-10 rounded-xl bg-pink-500/20 text-pink-400 flex items-center justify-center\">\n                    <i data-lucide=\"volume-2\" class=\"w-5 h-5\"><\/i>\n                <\/div>\n                <div>\n                    <h3 class=\"text-base font-bold text-white\">Awaz Ka Balance Set Karein<\/h3>\n                    <p class=\"text-xs text-zinc-400\">Kis ki awaz zyada aani chahiye?<\/p>\n                <\/div>\n            <\/div>\n\n            <div class=\"space-y-2.5 my-4\">\n                <button onclick=\"applyAudioChoice('drama')\" class=\"w-full text-left p-3 rounded-xl bg-gradient-to-r from-pink-600/20 to-indigo-600/20 hover:from-pink-600/30 hover:to-indigo-600/30 border border-pink-500/50 transition\">\n                    <div class=\"flex items-center justify-between\">\n                        <span class=\"text-sm font-semibold text-white\">1. Emotional Drama Mode (Recommended)<\/span>\n                        <span class=\"text-[10px] bg-pink-500 text-white px-2 py-0.5 rounded-full\">Best<\/span>\n                    <\/div>\n                    <p class=\"text-xs text-zinc-300 mt-1\">Original awaz (dialogues) bilkul saaf <b>100%<\/b> aur peeche halka halka sad song <b>18%<\/b> chalega.<\/p>\n                <\/button>\n\n                <button onclick=\"applyAudioChoice('songOnly')\" class=\"w-full text-left p-3 rounded-xl bg-studio-800 hover:bg-zinc-700 border border-zinc-700 transition\">\n                    <span class=\"text-sm font-semibold text-white\">2. Sirf Song Tez (Original Mute)<\/span>\n                    <p class=\"text-xs text-zinc-400 mt-1\">Original video ki awaz band (0%) aur background song 100% tez chalega.<\/p>\n                <\/button>\n\n                <button onclick=\"applyAudioChoice('equal')\" class=\"w-full text-left p-3 rounded-xl bg-studio-800 hover:bg-zinc-700 border border-zinc-700 transition\">\n                    <span class=\"text-sm font-semibold text-white\">3. Dono Barabar (50% - 50%)<\/span>\n                    <p class=\"text-xs text-zinc-400 mt-1\">Original awaz aur background song dono darmiyani awaz mein chalenge.<\/p>\n                <\/button>\n            <\/div>\n\n            <button onclick=\"closeAudioModal()\" class=\"w-full py-2 text-xs text-zinc-400 hover:text-white\">\n                Khud Sliders Se Adjust Karein\n            <\/button>\n        <\/div>\n    <\/div>\n\n    <!-- Modal: Export Progress -->\n    <div id=\"exportModal\" class=\"hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4\">\n        <div class=\"bg-studio-900 border border-zinc-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl\">\n            <div class=\"w-12 h-12 rounded-full border-4 border-indigo-500/30 border-t-indigo-500 animate-spin mx-auto mb-4\"><\/div>\n            <h3 class=\"text-base font-bold text-white\">Video Tayyar Ho Rahi Hai...<\/h3>\n            <p class=\"text-xs text-zinc-400 mt-1\">Videos, photos, icons aur mixed audio ko jora ja raha hai. Meharbani karke tab band na karein.<\/p>\n            \n            <div class=\"w-full bg-studio-800 h-2.5 rounded-full overflow-hidden mt-4\">\n                <div id=\"exportProgressBar\" class=\"bg-gradient-to-r from-indigo-500 to-pink-500 h-full transition-all duration-150\" style=\"width: 0%\"><\/div>\n            <\/div>\n            <p id=\"exportProgressText\" class=\"text-xs font-mono text-indigo-300 mt-2\">0%<\/p>\n        <\/div>\n    <\/div>\n\n    <!-- Custom Toast Notification -->\n    <div id=\"toast\" class=\"fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-zinc-800 border border-zinc-600 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-opacity duration-200\">\n        Message\n    <\/div>\n\n    <script>\n        // Initialize Lucide Icons\n        lucide.createIcons();\n\n        // ==================== APPLICATION STATE ====================\n        const state = {\n            clips: [], // { id, type: 'video'|'image', name, url, element, sourceDuration, trimStart, trimEnd, fade, thumbUrl }\n            selectedClipId: null,\n            overlays: [], // { id, name, url, img, xNorm, yNorm, wNorm, aspect, locked }\n            activeOverlayId: null, // Currently being moved/resized (null when Done is clicked)\n            bgAudio: {\n                url: null,\n                name: '',\n                element: new Audio(),\n                duration: 0,\n                loop: true\n            },\n            volumes: {\n                original: 1.0,\n                background: 0.20\n            },\n            playback: {\n                isPlaying: false,\n                currentTime: 0,\n                totalDuration: 0,\n                lastFrameTime: 0\n            },\n            aspectRatio: '16:9',\n            isExporting: false\n        };\n\n        // ==================== UNDO / REDO HISTORY STACK ====================\n        const historyStack = [];\n        let historyIndex = -1;\n        let isRestoringHistory = false;\n\n        function createSnapshot() {\n            return {\n                clips: state.clips.map(c => ({\n                    id: c.id,\n                    type: c.type,\n                    name: c.name,\n                    url: c.url,\n                    element: c.element,\n                    sourceDuration: c.sourceDuration,\n                    trimStart: c.trimStart,\n                    trimEnd: c.trimEnd,\n                    fade: c.fade,\n                    thumbUrl: c.thumbUrl\n                })),\n                selectedClipId: state.selectedClipId,\n                overlays: state.overlays.map(o => ({\n                    id: o.id,\n                    name: o.name,\n                    url: o.url,\n                    img: o.img,\n                    xNorm: o.xNorm,\n                    yNorm: o.yNorm,\n                    wNorm: o.wNorm,\n                    aspect: o.aspect,\n                    locked: o.locked\n                })),\n                activeOverlayId: state.activeOverlayId,\n                volumes: { ...state.volumes },\n                aspectRatio: state.aspectRatio\n            };\n        }\n\n        function saveHistoryState() {\n            if (isRestoringHistory) return;\n            // Remove any forward states if user performed a new action after Undo\n            historyStack.splice(historyIndex + 1);\n            historyStack.push(createSnapshot());\n            if (historyStack.length > 40) historyStack.shift();\n            else historyIndex++;\n            updateUndoRedoButtons();\n        }\n\n        function restoreSnapshot(snap) {\n            isRestoringHistory = true;\n            pausePlayback();\n\n            state.clips = snap.clips.map(c => ({ ...c }));\n            state.selectedClipId = snap.selectedClipId;\n            state.overlays = snap.overlays.map(o => ({ ...o }));\n            state.activeOverlayId = snap.activeOverlayId;\n            state.volumes = { ...snap.volumes };\n            state.aspectRatio = snap.aspectRatio;\n\n            document.getElementById('aspectRatioSelect').value = state.aspectRatio;\n            setOrigVol(Math.round(state.volumes.original * 100), false);\n            setBgVol(Math.round(state.volumes.background * 100), false);\n\n            recalculateTotalDuration();\n            renderTimeline();\n            renderOverlaysList();\n            updateOverlayEditBar();\n            updateCanvasDimensions();\n            updateUndoRedoButtons();\n            isRestoringHistory = false;\n        }\n\n        function performUndo() {\n            if (historyIndex > 0) {\n                historyIndex--;\n                restoreSnapshot(historyStack[historyIndex]);\n                showToast(\"Peeche (Undo) kar diya gaya\");\n            }\n        }\n\n        function performRedo() {\n            if (historyIndex < historyStack.length - 1) {\n                historyIndex++;\n                restoreSnapshot(historyStack[historyIndex]);\n                showToast(\"Aage (Redo) kar diya gaya\");\n            }\n        }\n\n        function updateUndoRedoButtons() {\n            const canUndo = historyIndex > 0;\n            const canRedo = historyIndex < historyStack.length - 1;\n            document.getElementById('undoBtn').disabled = !canUndo;\n            document.getElementById('redoBtn').disabled = !canRedo;\n            document.getElementById('sideUndoBtn').disabled = !canUndo;\n            document.getElementById('sideRedoBtn').disabled = !canRedo;\n        }\n\n        document.getElementById('undoBtn').addEventListener('click', performUndo);\n        document.getElementById('redoBtn').addEventListener('click', performRedo);\n        document.getElementById('sideUndoBtn').addEventListener('click', performUndo);\n        document.getElementById('sideRedoBtn').addEventListener('click', performRedo);\n\n        // Keyboard Shortcuts Ctrl+Z / Ctrl+Y\n        window.addEventListener('keydown', (e) => {\n            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {\n                e.preventDefault();\n                if (e.shiftKey) performRedo();\n                else performUndo();\n            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {\n                e.preventDefault();\n                performRedo();\n            }\n        });\n\n        // ==================== WEB AUDIO API MIXER SETUP ====================\n        let audioCtx = null;\n        let origGainNode = null;\n        let bgGainNode = null;\n        let bgMediaSource = null;\n        let mixedDestination = null;\n        const connectedVideoNodes = new WeakMap();\n\n        function initAudioContext() {\n            if (!audioCtx) {\n                const AudioContextClass = window.AudioContext || window.webkitAudioContext;\n                audioCtx = new AudioContextClass();\n\n                origGainNode = audioCtx.createGain();\n                bgGainNode = audioCtx.createGain();\n                mixedDestination = audioCtx.createMediaStreamDestination();\n\n                origGainNode.gain.value = state.volumes.original;\n                bgGainNode.gain.value = state.volumes.background;\n\n                origGainNode.connect(audioCtx.destination);\n                origGainNode.connect(mixedDestination);\n\n                bgGainNode.connect(audioCtx.destination);\n                bgGainNode.connect(mixedDestination);\n\n                state.bgAudio.element.crossOrigin = \"anonymous\";\n                bgMediaSource = audioCtx.createMediaElementSource(state.bgAudio.element);\n                bgMediaSource.connect(bgGainNode);\n            }\n            if (audioCtx.state === 'suspended') {\n                audioCtx.resume();\n            }\n        }\n\n        function connectVideoToMixer(videoEl) {\n            initAudioContext();\n            if (!connectedVideoNodes.has(videoEl)) {\n                try {\n                    const source = audioCtx.createMediaElementSource(videoEl);\n                    source.connect(origGainNode);\n                    connectedVideoNodes.set(videoEl, source);\n                } catch (e) {\n                    console.warn(\"Audio node connection skipped:\", e);\n                }\n            }\n        }\n\n        // ==================== DOM ELEMENTS ====================\n        const canvas = document.getElementById('previewCanvas');\n        const ctx = canvas.getContext('2d');\n        const emptyState = document.getElementById('emptyState');\n        const timelineContainer = document.getElementById('timelineContainer');\n        const seekSlider = document.getElementById('seekSlider');\n        const currentTimeDisplay = document.getElementById('currentTimeDisplay');\n        const totalTimeDisplay = document.getElementById('totalTimeDisplay');\n        const playPauseBtn = document.getElementById('playPauseBtn');\n        const playIcon = document.getElementById('playIcon');\n        const playText = document.getElementById('playText');\n\n        // ==================== HELPER FUNCTIONS ====================\n        function showToast(msg) {\n            const toast = document.getElementById('toast');\n            toast.textContent = msg;\n            toast.classList.remove('opacity-0');\n            setTimeout(() => toast.classList.add('opacity-0'), 2600);\n        }\n\n        function formatTime(sec) {\n            if (!isFinite(sec) || sec < 0) sec = 0;\n            const m = Math.floor(sec / 60);\n            const s = Math.floor(sec % 60);\n            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;\n        }\n\n        function getClipDuration(clip) {\n            return Math.max(0.2, clip.trimEnd - clip.trimStart);\n        }\n\n        function recalculateTotalDuration() {\n            state.playback.totalDuration = state.clips.reduce((acc, c) => acc + getClipDuration(c), 0);\n            totalTimeDisplay.textContent = formatTime(state.playback.totalDuration);\n            seekSlider.max = state.playback.totalDuration || 100;\n            document.getElementById('clipCountBadge').textContent = `${state.clips.length} Clip${state.clips.length === 1 ? '' : 's'}`;\n            const hasContent = state.clips.length > 0 || state.overlays.length > 0;\n            emptyState.classList.toggle('hidden', hasContent);\n            document.getElementById('liveAudioBadge').classList.toggle('hidden', state.clips.length === 0);\n        }\n\n        function updateCanvasDimensions() {\n            const ratio = state.aspectRatio;\n            if (ratio === '16:9') {\n                canvas.width = 1280;\n                canvas.height = 720;\n            } else if (ratio === '9:16') {\n                canvas.width = 720;\n                canvas.height = 1280;\n            } else {\n                canvas.width = 1080;\n                canvas.height = 1080;\n            }\n            renderFrameAtTime(state.playback.currentTime);\n        }\n\n        // ==================== ADD ICON / PIC OVERLAY FEATURE ====================\n        function handleIconFileSelect(e) {\n            const file = e.target.files[0];\n            if (!file) return;\n\n            const url = URL.createObjectURL(file);\n            const img = new Image();\n            img.crossOrigin = \"anonymous\";\n            img.src = url;\n            img.onload = () => {\n                const aspect = (img.naturalHeight || 1) / (img.naturalWidth || 1);\n                const newOverlay = {\n                    id: 'ov_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),\n                    name: file.name,\n                    url,\n                    img,\n                    xNorm: 0.5, // Center X (0 to 1)\n                    yNorm: 0.5, // Center Y (0 to 1)\n                    wNorm: 0.25, // 25% of canvas width\n                    aspect,\n                    locked: false\n                };\n\n                state.overlays.push(newOverlay);\n                state.activeOverlayId = newOverlay.id;\n\n                recalculateTotalDuration();\n                updateOverlayEditBar();\n                renderOverlaysList();\n                renderFrameAtTime(state.playback.currentTime);\n                saveHistoryState();\n                showToast(\"Pic aa gayi! Screen par set karke 'Done' dabayein.\");\n            };\n            e.target.value = '';\n        }\n\n        document.getElementById('iconOverlayInput').addEventListener('change', handleIconFileSelect);\n        document.getElementById('iconOverlayInput2').addEventListener('change', handleIconFileSelect);\n\n        function getActiveOverlay() {\n            return state.overlays.find(o => o.id === state.activeOverlayId) || null;\n        }\n\n        function updateOverlayEditBar() {\n            const bar = document.getElementById('overlayEditBar');\n            const active = getActiveOverlay();\n            if (!active) {\n                bar.classList.add('hidden');\n                return;\n            }\n            bar.classList.remove('hidden');\n            const pct = Math.round(active.wNorm * 100);\n            document.getElementById('overlaySizeSlider').value = pct;\n            document.getElementById('overlaySizeLabel').textContent = `${pct}%`;\n        }\n\n        // Size Slider for Active Icon/Pic\n        document.getElementById('overlaySizeSlider').addEventListener('input', (e) => {\n            const active = getActiveOverlay();\n            if (!active) return;\n            const pct = Number(e.target.value);\n            active.wNorm = pct / 100;\n            document.getElementById('overlaySizeLabel').textContent = `${pct}%`;\n            renderFrameAtTime(state.playback.currentTime);\n        });\n        document.getElementById('overlaySizeSlider').addEventListener('change', () => {\n            saveHistoryState();\n        });\n\n        // \"Done\" Button to Lock/Fix the Icon in Place\n        document.getElementById('doneOverlayBtn').addEventListener('click', () => {\n            const active = getActiveOverlay();\n            if (active) {\n                active.locked = true;\n                state.activeOverlayId = null;\n                updateOverlayEditBar();\n                renderOverlaysList();\n                renderFrameAtTime(state.playback.currentTime);\n                saveHistoryState();\n                showToast(\"Done! Pic / Icon video par fix ho gayi.\");\n            }\n        });\n\n        // Delete Active Icon\n        document.getElementById('deleteOverlayBtn').addEventListener('click', () => {\n            if (!state.activeOverlayId) return;\n            state.overlays = state.overlays.filter(o => o.id !== state.activeOverlayId);\n            state.activeOverlayId = null;\n            recalculateTotalDuration();\n            updateOverlayEditBar();\n            renderOverlaysList();\n            renderFrameAtTime(state.playback.currentTime);\n            saveHistoryState();\n            showToast(\"Icon / Pic hata di gayi.\");\n        });\n\n        function renderOverlaysList() {\n            const list = document.getElementById('overlaysList');\n            if (state.overlays.length === 0) {\n                list.innerHTML = `<p class=\"text-[11px] text-zinc-500 text-center py-2\">Abhi koi icon ya pic video par nahi lagayi gayi<\/p>`;\n                return;\n            }\n            list.innerHTML = '';\n            state.overlays.forEach((ov, idx) => {\n                const isEditing = ov.id === state.activeOverlayId;\n                const row = document.createElement('div');\n                row.className = `flex items-center justify-between p-2 rounded-xl border text-xs cursor-pointer transition ${\n                    isEditing ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-200' : 'bg-studio-900/80 border-zinc-800 text-zinc-300 hover:border-zinc-600'\n                }`;\n                row.innerHTML = `\n                    <div class=\"flex items-center gap-2 truncate\">\n                        <img src=\"${ov.url}\" class=\"w-6 h-6 rounded object-cover bg-black border border-zinc-700\">\n                        <span class=\"truncate max-w-[160px]\">${idx + 1}. ${ov.name}<\/span>\n                    <\/div>\n                    <span class=\"text-[10px] px-2 py-0.5 rounded-full ${isEditing ? 'bg-emerald-500 text-zinc-950 font-bold' : 'bg-zinc-800 text-zinc-400'}\">\n                        ${isEditing ? 'Editing...' : 'Fixed (Edit)'}\n                    <\/span>\n                `;\n                row.onclick = () => {\n                    ov.locked = false;\n                    state.activeOverlayId = ov.id;\n                    updateOverlayEditBar();\n                    renderOverlaysList();\n                    renderFrameAtTime(state.playback.currentTime);\n                };\n                list.appendChild(row);\n            });\n        }\n\n        // ==================== CANVAS INTERACTIVE DRAG & RESIZE FOR ICON/PIC ====================\n        let dragState = {\n            mode: null, // 'move' | 'resize'\n            startX: 0,\n            startY: 0,\n            origXNorm: 0,\n            origYNorm: 0,\n            origWNorm: 0,\n            moved: false\n        };\n\n        function getCanvasPointerPos(clientX, clientY) {\n            const rect = canvas.getBoundingClientRect();\n            const scaleX = canvas.width / rect.width;\n            const scaleY = canvas.height / rect.height;\n            return {\n                x: (clientX - rect.left) * scaleX,\n                y: (clientY - rect.top) * scaleY\n            };\n        }\n\n        function getOverlayRectPx(ov) {\n            const w = ov.wNorm * canvas.width;\n            const h = w * ov.aspect;\n            const x = ov.xNorm * canvas.width - w / 2;\n            const y = ov.yNorm * canvas.height - h / 2;\n            return { x, y, w, h };\n        }\n\n        function handlePointerDown(clientX, clientY) {\n            const pt = getCanvasPointerPos(clientX, clientY);\n            const active = getActiveOverlay();\n\n            // 1. Check resize handle of active overlay first (bottom-right corner)\n            if (active) {\n                const r = getOverlayRectPx(active);\n                const handleRadius = Math.max(24, canvas.width * 0.025);\n                const distBR = Math.hypot(pt.x - (r.x + r.w), pt.y - (r.y + r.h));\n                if (distBR <= handleRadius) {\n                    dragState = {\n                        mode: 'resize',\n                        startX: pt.x,\n                        startY: pt.y,\n                        origXNorm: active.xNorm,\n                        origYNorm: active.yNorm,\n                        origWNorm: active.wNorm,\n                        moved: false\n                    };\n                    return true;\n                }\n            }\n\n            // 2. Check if user clicked/touched inside any overlay (from topmost to bottom)\n            for (let i = state.overlays.length - 1; i >= 0; i--) {\n                const ov = state.overlays[i];\n                const r = getOverlayRectPx(ov);\n                if (pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h) {\n                    // Activate it for editing if it was locked\n                    if (state.activeOverlayId !== ov.id) {\n                        ov.locked = false;\n                        state.activeOverlayId = ov.id;\n                        updateOverlayEditBar();\n                        renderOverlaysList();\n                        renderFrameAtTime(state.playback.currentTime);\n                    }\n                    dragState = {\n                        mode: 'move',\n                        startX: pt.x,\n                        startY: pt.y,\n                        origXNorm: ov.xNorm,\n                        origYNorm: ov.yNorm,\n                        origWNorm: ov.wNorm,\n                        moved: false\n                    };\n                    return true;\n                }\n            }\n            return false;\n        }\n\n        function handlePointerMove(clientX, clientY) {\n            if (!dragState.mode) return;\n            const active = getActiveOverlay();\n            if (!active) return;\n\n            const pt = getCanvasPointerPos(clientX, clientY);\n            const dx = pt.x - dragState.startX;\n            const dy = pt.y - dragState.startY;\n            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragState.moved = true;\n\n            if (dragState.mode === 'move') {\n                active.xNorm = Math.max(0.02, Math.min(0.98, dragState.origXNorm + dx / canvas.width));\n                active.yNorm = Math.max(0.02, Math.min(0.98, dragState.origYNorm + dy / canvas.height));\n            } else if (dragState.mode === 'resize') {\n                const newWNorm = Math.max(0.05, Math.min(0.92, dragState.origWNorm + (dx * 1.4) / canvas.width));\n                active.wNorm = newWNorm;\n                const pct = Math.round(newWNorm * 100);\n                document.getElementById('overlaySizeSlider').value = pct;\n                document.getElementById('overlaySizeLabel').textContent = `${pct}%`;\n            }\n\n            renderFrameAtTime(state.playback.currentTime);\n        }\n\n        function handlePointerUp() {\n            if (dragState.mode && dragState.moved) {\n                saveHistoryState();\n            }\n            dragState.mode = null;\n        }\n\n        // Mouse Events on Canvas\n        canvas.addEventListener('mousedown', (e) => {\n            if (handlePointerDown(e.clientX, e.clientY)) e.preventDefault();\n        });\n        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));\n        window.addEventListener('mouseup', handlePointerUp);\n\n        // Touch Events on Canvas (Mobile friendly drag & resize)\n        canvas.addEventListener('touchstart', (e) => {\n            if (e.touches.length === 1) {\n                const t = e.touches[0];\n                if (handlePointerDown(t.clientX, t.clientY)) e.preventDefault();\n            }\n        }, { passive: false });\n\n        window.addEventListener('touchmove', (e) => {\n            if (dragState.mode && e.touches.length === 1) {\n                const t = e.touches[0];\n                handlePointerMove(t.clientX, t.clientY);\n                e.preventDefault();\n            }\n        }, { passive: false });\n\n        window.addEventListener('touchend', handlePointerUp);\n\n        // ==================== MEDIA UPLOAD (VIDEOS & PHOTOS) ====================\n        document.getElementById('mediaInput').addEventListener('change', async (e) => {\n            const files = Array.from(e.target.files);\n            if (!files.length) return;\n\n            showToast(`${files.length} file(s) load ho rahi hain...`);\n            for (const file of files) {\n                const url = URL.createObjectURL(file);\n                if (file.type.startsWith('video/')) {\n                    await addVideoClip(file.name, url);\n                } else if (file.type.startsWith('image/')) {\n                    await addImageClip(file.name, url);\n                }\n            }\n            e.target.value = '';\n            recalculateTotalDuration();\n            renderTimeline();\n            renderFrameAtTime(state.playback.currentTime);\n            saveHistoryState();\n            showToast(\"Media timeline mein jor di gayi!\");\n        });\n\n        function addVideoClip(name, url) {\n            return new Promise((resolve) => {\n                const video = document.createElement('video');\n                video.src = url;\n                video.crossOrigin = \"anonymous\";\n                video.playsInline = true;\n                video.preload = \"auto\";\n                video.muted = false;\n\n                video.onloadedmetadata = () => {\n                    const dur = video.duration || 5;\n                    video.currentTime = Math.min(0.5, dur / 2);\n                };\n\n                video.onseeked = () => {\n                    if (video._thumbDone) return;\n                    video._thumbDone = true;\n\n                    const thumbCanvas = document.createElement('canvas');\n                    thumbCanvas.width = 160;\n                    thumbCanvas.height = 90;\n                    thumbCanvas.getContext('2d').drawImage(video, 0, 0, 160, 90);\n                    const thumbUrl = thumbCanvas.toDataURL('image/jpeg', 0.7);\n                    video.currentTime = 0;\n\n                    const clip = {\n                        id: 'clip_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),\n                        type: 'video',\n                        name,\n                        url,\n                        element: video,\n                        sourceDuration: video.duration,\n                        trimStart: 0,\n                        trimEnd: video.duration,\n                        fade: true,\n                        thumbUrl\n                    };\n                    state.clips.push(clip);\n                    if (!state.selectedClipId) state.selectedClipId = clip.id;\n                    resolve();\n                };\n            });\n        }\n\n        function addImageClip(name, url) {\n            return new Promise((resolve) => {\n                const img = new Image();\n                img.crossOrigin = \"anonymous\";\n                img.src = url;\n                img.onload = () => {\n                    const clip = {\n                        id: 'clip_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),\n                        type: 'image',\n                        name,\n                        url,\n                        element: img,\n                        sourceDuration: 3.0,\n                        trimStart: 0,\n                        trimEnd: 3.0,\n                        fade: true,\n                        thumbUrl: url\n                    };\n                    state.clips.push(clip);\n                    if (!state.selectedClipId) state.selectedClipId = clip.id;\n                    resolve();\n                };\n            });\n        }\n\n        // ==================== BACKGROUND SONG & AUDIO BALANCE ====================\n        document.getElementById('audioInput').addEventListener('change', (e) => {\n            const file = e.target.files[0];\n            if (!file) return;\n\n            initAudioContext();\n            const url = URL.createObjectURL(file);\n            state.bgAudio.url = url;\n            state.bgAudio.name = file.name;\n            state.bgAudio.element.src = url;\n            state.bgAudio.element.loop = state.bgAudio.loop;\n\n            document.getElementById('bgSongName').textContent = file.name;\n            document.getElementById('songBtnLabel').textContent = \"Change Song\";\n            document.getElementById('removeSongBtn').classList.remove('hidden');\n            document.getElementById('bgTrackFill').classList.remove('hidden');\n            document.getElementById('bgTrackEmpty').classList.add('hidden');\n            updateBgTrackVisual();\n\n            document.getElementById('audioPromptModal').classList.remove('hidden');\n            e.target.value = '';\n        });\n\n        function applyAudioChoice(mode) {\n            if (mode === 'drama') {\n                setOrigVol(100, false);\n                setBgVol(18, true);\n                showToast(\"Emotional Drama Mode: Original awaz saaf (100%) + Halka sad song (18%)\");\n            } else if (mode === 'songOnly') {\n                setOrigVol(0, false);\n                setBgVol(100, true);\n                showToast(\"Original awaz mute (0%) aur Background Song 100% set ho gaya\");\n            } else if (mode === 'equal') {\n                setOrigVol(70, false);\n                setBgVol(65, true);\n                showToast(\"Dono awazein balance kar di gayin\");\n            }\n            closeAudioModal();\n        }\n\n        function closeAudioModal() {\n            document.getElementById('audioPromptModal').classList.add('hidden');\n        }\n\n        function setOrigVol(val, recordHistory = false) {\n            val = Math.max(0, Math.min(150, Number(val)));\n            state.volumes.original = val / 100;\n            document.getElementById('origVolSlider').value = val;\n            document.getElementById('origVolLabel').textContent = `${val}%`;\n            if (origGainNode) origGainNode.gain.value = state.volumes.original;\n            updateLiveBadge();\n            if (recordHistory) saveHistoryState();\n        }\n\n        function setBgVol(val, recordHistory = false) {\n            val = Math.max(0, Math.min(100, Number(val)));\n            state.volumes.background = val / 100;\n            document.getElementById('bgVolSlider').value = val;\n            document.getElementById('bgVolLabel').textContent = `${val}%`;\n            if (bgGainNode) bgGainNode.gain.value = state.volumes.background;\n            updateBgTrackVisual();\n            updateLiveBadge();\n            if (recordHistory) saveHistoryState();\n        }\n\n        function updateLiveBadge() {\n            const o = Math.round(state.volumes.original * 100);\n            const b = Math.round(state.volumes.background * 100);\n            document.getElementById('badgeText').textContent = `Original: ${o}% | Song: ${b}%`;\n        }\n\n        function updateBgTrackVisual() {\n            const pct = Math.round(state.volumes.background * 100);\n            const fill = document.getElementById('bgTrackFill');\n            const text = document.getElementById('bgTrackText');\n            fill.style.opacity = Math.max(0.35, state.volumes.background);\n            text.textContent = `${state.bgAudio.name || 'Background Song'} \u2014 Awaz: ${pct}% ${pct <= 25 ? '(Halka Background)' : ''}`;\n        }\n\n        document.getElementById('origVolSlider').addEventListener('input', (e) => setOrigVol(e.target.value, false));\n        document.getElementById('origVolSlider').addEventListener('change', () => saveHistoryState());\n\n        document.getElementById('bgVolSlider').addEventListener('input', (e) => setBgVol(e.target.value, false));\n        document.getElementById('bgVolSlider').addEventListener('change', () => saveHistoryState());\n\n        document.getElementById('dramaPresetBtn').addEventListener('click', () => applyAudioChoice('drama'));\n        document.getElementById('loopSongCheck').addEventListener('change', (e) => {\n            state.bgAudio.loop = e.target.checked;\n            state.bgAudio.element.loop = e.target.checked;\n        });\n\n        document.getElementById('removeSongBtn').addEventListener('click', () => {\n            state.bgAudio.element.pause();\n            state.bgAudio.url = null;\n            state.bgAudio.name = '';\n            document.getElementById('bgSongName').textContent = 'Koi background song nahi laga';\n            document.getElementById('songBtnLabel').textContent = 'Add Song';\n            document.getElementById('removeSongBtn').classList.add('hidden');\n            document.getElementById('bgTrackFill').classList.add('hidden');\n            document.getElementById('bgTrackEmpty').classList.remove('hidden');\n            showToast(\"Background song hata diya gaya\");\n        });\n\n        // ==================== TIMELINE RENDERING & CLIP SELECTION ====================\n        function renderTimeline() {\n            timelineContainer.innerHTML = '';\n            if (state.clips.length === 0) {\n                timelineContainer.innerHTML = `<div class=\"text-xs text-zinc-500 w-full text-center py-4\">Yahan aap ki jori hui videos aur photos nazar aayengi...<\/div>`;\n                updateClipControlsUI();\n                return;\n            }\n\n            state.clips.forEach((clip, idx) => {\n                const dur = getClipDuration(clip).toFixed(1);\n                const isSelected = clip.id === state.selectedClipId;\n                const widthPx = Math.max(105, Math.min(240, getClipDuration(clip) * 28));\n\n                const card = document.createElement('div');\n                card.style.width = `${widthPx}px`;\n                card.className={`shrink-0 h-16 rounded-xl border-2 overflow-hidden relative cursor-pointer transition group ${\n                    isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/30' : 'border-zinc-700 hover:border-zinc-500'\n                }`;\n\n                card.innerHTML = `\n                    <img src=\"${clip.thumbUrl}\" class=\"w-full h-full object-cover opacity-75 group-hover:opacity-95 transition\">\n                    <div class=\"absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent p-1.5 flex flex-col justify-between\">\n                        <div class=\"flex items-center justify-between\">\n                            <span class=\"text-[10px] font-bold px-1.5 py-0.2 rounded ${clip.type === 'video' ? 'bg-indigo-600/90 text-white' : 'bg-emerald-600/90 text-white'}\">\n                                ${idx + 1}. ${clip.type === 'video' ? 'VID' : 'IMG'}\n                            <\/span>\n                            <span class=\"text-[10px] font-mono text-zinc-200 bg-black/60 px-1 rounded\">${dur}s<\/span>\n                        <\/div>\n                        <p class=\"text-[10px] text-zinc-200 truncate\">${clip.name}<\/p>\n                    <\/div>\n                `;\n\n                card.onclick = () => {\n                    selectClip(clip.id);\n                    let startOffset = 0;\n                    for (let i = 0; i < idx; i++) startOffset += getClipDuration(state.clips[i]);\n                    seekTo(startOffset);\n                };\n\n                timelineContainer.appendChild(card);\n            });\n\n            updateClipControlsUI();\n        }\n\n        function selectClip(id) {\n            state.selectedClipId = id;\n            renderTimeline();\n        }\n\n        function getSelectedClip() {\n            return state.clips.find(c => c.id === state.selectedClipId) || null;\n        }\n\n        function updateClipControlsUI() {\n            const clip = getSelectedClip();\n            const body = document.getElementById('clipControlsBody');\n            const title = document.getElementById('selectedClipTitle');\n            const photoBox = document.getElementById('photoDurationBox');\n            const videoBox = document.getElementById('videoTrimBox');\n\n            const hasClip = !!clip;\n            document.getElementById('splitBtn').disabled = !hasClip;\n            document.getElementById('deleteClipBtn').disabled = !hasClip;\n            document.getElementById('moveLeftBtn').disabled = !hasClip || state.clips[0]?.id === clip.id;\n            document.getElementById('moveRightBtn').disabled = !hasClip || state.clips[state.clips.length - 1]?.id === clip.id;\n\n            if (!clip) {\n                body.classList.add('opacity-50', 'pointer-events-none');\n                title.textContent = 'Timeline se koi clip select karein';\n                return;\n            }\n\n            body.classList.remove('opacity-50', 'pointer-events-none');\n            title.textContent = `Selected: ${clip.name}`;\n            document.getElementById('fadeToggle').checked = clip.fade;\n\n            if (clip.type === 'image') {\n                photoBox.classList.remove('hidden');\n                videoBox.classList.add('hidden');\n                const dur = getClipDuration(clip);\n                document.getElementById('photoDurSlider').value = dur;\n                document.getElementById('photoDurVal').textContent = `${dur.toFixed(1)}s`;\n            } else {\n                photoBox.classList.add('hidden');\n                videoBox.classList.remove('hidden');\n\n                const sSlider = document.getElementById('trimStartSlider');\n                const eSlider = document.getElementById('trimEndSlider');\n                sSlider.max = clip.sourceDuration;\n                eSlider.max = clip.sourceDuration;\n                sSlider.value = clip.trimStart;\n                eSlider.value = clip.trimEnd;\n\n                document.getElementById('trimStartVal').textContent = `${clip.trimStart.toFixed(1)}s`;\n                document.getElementById('trimEndVal').textContent = `${clip.trimEnd.toFixed(1)}s`;\n            }\n        }\n\n        // Photo duration slider\n        document.getElementById('photoDurSlider').addEventListener('input', (e) => {\n            const clip = getSelectedClip();\n            if (!clip || clip.type !== 'image') return;\n            const val = parseFloat(e.target.value);\n            clip.sourceDuration = val;\n            clip.trimStart = 0;\n            clip.trimEnd = val;\n            document.getElementById('photoDurVal').textContent = `${val.toFixed(1)}s`;\n            recalculateTotalDuration();\n            renderTimeline();\n        });\n        document.getElementById('photoDurSlider').addEventListener('change', () => saveHistoryState());\n\n        // Video trim start/end sliders\n        document.getElementById('trimStartSlider').addEventListener('input', (e) => {\n            const clip = getSelectedClip();\n            if (!clip || clip.type !== 'video') return;\n            let val = parseFloat(e.target.value);\n            if (val >= clip.trimEnd - 0.3) val = Math.max(0, clip.trimEnd - 0.3);\n            clip.trimStart = val;\n            document.getElementById('trimStartVal').textContent = `${val.toFixed(1)}s`;\n            recalculateTotalDuration();\n            renderTimeline();\n        });\n        document.getElementById('trimStartSlider').addEventListener('change', () => saveHistoryState());\n\n        document.getElementById('trimEndSlider').addEventListener('input', (e) => {\n            const clip = getSelectedClip();\n            if (!clip || clip.type !== 'video') return;\n            let val = parseFloat(e.target.value);\n            if (val <= clip.trimStart + 0.3) val = Math.min(clip.sourceDuration, clip.trimStart + 0.3);\n            clip.trimEnd = val;\n            document.getElementById('trimEndVal').textContent = `${val.toFixed(1)}s`;\n            recalculateTotalDuration();\n            renderTimeline();\n        });\n        document.getElementById('trimEndSlider').addEventListener('change', () => saveHistoryState());\n\n        document.getElementById('fadeToggle').addEventListener('change', (e) => {\n            const clip = getSelectedClip();\n            if (clip) {\n                clip.fade = e.target.checked;\n                saveHistoryState();\n            }\n        });\n\n        // ==================== EDITING TOOLS: SPLIT, MOVE, DELETE ====================\n        document.getElementById('splitBtn').addEventListener('click', () => {\n            if (state.clips.length === 0) return;\n            const info = getClipAtTimelineTime(state.playback.currentTime);\n            if (!info) return;\n\n            const { clip, localTime, index } = info;\n            const dur = getClipDuration(clip);\n\n            if (localTime < 0.25 || localTime > dur - 0.25) {\n                showToast(\"Split karne ke liye playhead ko clip ke darmiyan mein rakhein\");\n                return;\n            }\n\n            if (clip.type === 'image') {\n                const firstHalf = { ...clip, id: 'clip_' + Date.now() + '_a', trimStart: 0, trimEnd: localTime, sourceDuration: localTime };\n                const secondHalf = { ...clip, id: 'clip_' + Date.now() + '_b', trimStart: 0, trimEnd: dur - localTime, sourceDuration: dur - localTime };\n                state.clips.splice(index, 1, firstHalf, secondHalf);\n                state.selectedClipId = secondHalf.id;\n            } else {\n                const splitPoint = clip.trimStart + localTime;\n                const video2 = document.createElement('video');\n                video2.src = clip.url;\n                video2.crossOrigin = \"anonymous\";\n                video2.playsInline = true;\n                video2.preload = \"auto\";\n\n                const firstHalf = { ...clip, id: 'clip_' + Date.now() + '_a', trimEnd: splitPoint };\n                const secondHalf = {\n                    ...clip,\n                    id: 'clip_' + Date.now() + '_b',\n                    element: video2,\n                    trimStart: splitPoint,\n                    trimEnd: clip.trimEnd\n                };\n                state.clips.splice(index, 1, firstHalf, secondHalf);\n                state.selectedClipId = secondHalf.id;\n            }\n\n            recalculateTotalDuration();\n            renderTimeline();\n            saveHistoryState();\n            showToast(\"Clip 2 hisson mein Split ho gayi!\");\n        });\n\n        document.getElementById('deleteClipBtn').addEventListener('click', () => {\n            const idx = state.clips.findIndex(c => c.id === state.selectedClipId);\n            if (idx === -1) return;\n            const removed = state.clips.splice(idx, 1)[0];\n            if (removed.type === 'video') removed.element.pause();\n\n            state.selectedClipId = state.clips[idx]?.id || state.clips[idx - 1]?.id || null;\n            recalculateTotalDuration();\n            state.playback.currentTime = Math.min(state.playback.currentTime, state.playback.totalDuration);\n            renderTimeline();\n            renderFrameAtTime(state.playback.currentTime);\n            saveHistoryState();\n            showToast(\"Clip delete kar di gayi\");\n        });\n\n        document.getElementById('moveLeftBtn').addEventListener('click', () => {\n            const idx = state.clips.findIndex(c => c.id === state.selectedClipId);\n            if (idx > 0) {\n                [state.clips[idx - 1], state.clips[idx]] = [state.clips[idx], state.clips[idx - 1]];\n                renderTimeline();\n                saveHistoryState();\n            }\n        });\n\n        document.getElementById('moveRightBtn').addEventListener('click', () => {\n            const idx = state.clips.findIndex(c => c.id === state.selectedClipId);\n            if (idx !== -1 && idx < state.clips.length - 1) {\n                [state.clips[idx + 1], state.clips[idx]] = [state.clips[idx], state.clips[idx + 1]];\n                renderTimeline();\n                saveHistoryState();\n            }\n        });\n\n        // ==================== PLAYBACK & CANVAS RENDERING ENGINE ====================\n        function getClipAtTimelineTime(t) {\n            let acc = 0;\n            for (let i = 0; i < state.clips.length; i++) {\n                const dur = getClipDuration(state.clips[i]);\n                if (t >= acc && t <= acc + dur) {\n                    return { clip: state.clips[i], localTime: t - acc, index: i };\n                }\n                acc += dur;\n            }\n            if (state.clips.length > 0) {\n                const last = state.clips[state.clips.length - 1];\n                return { clip: last, localTime: getClipDuration(last), index: state.clips.length - 1 };\n            }\n            return null;\n        }\n\n        function drawMediaContain(mediaEl, alpha = 1) {\n            ctx.save();\n            ctx.fillStyle = '#000000';\n            ctx.fillRect(0, 0, canvas.width, canvas.height);\n            ctx.globalAlpha = alpha;\n\n            const mw = mediaEl.videoWidth || mediaEl.naturalWidth || canvas.width;\n            const mh = mediaEl.videoHeight || mediaEl.naturalHeight || canvas.height;\n            if (!mw || !mh) {\n                ctx.restore();\n                return;\n            }\n\n            const scale = Math.min(canvas.width / mw, canvas.height / mh);\n            const dw = mw * scale;\n            const dh = mh * scale;\n            const dx = (canvas.width - dw) / 2;\n            const dy = (canvas.height - dh) / 2;\n\n            ctx.drawImage(mediaEl, dx, dy, dw, dh);\n            ctx.restore();\n        }\n\n        function drawOverlaysOnCanvas() {\n            if (state.overlays.length === 0) return;\n\n            state.overlays.forEach((ov) => {\n                const r = getOverlayRectPx(ov);\n                ctx.save();\n                ctx.drawImage(ov.img, r.x, r.y, r.w, r.h);\n\n                // Draw interactive bounding box & resize handle ONLY when not locked AND not exporting\n                if (!ov.locked && ov.id === state.activeOverlayId && !state.isExporting) {\n                    ctx.strokeStyle = '#10b981';\n                    ctx.lineWidth = Math.max(3, canvas.width * 0.003);\n                    ctx.setLineDash([10, 6]);\n                    ctx.strokeRect(r.x, r.y, r.w, r.h);\n                    ctx.setLineDash([]);\n\n                    // Corner resize handle (Bottom-Right)\n                    const handleR = Math.max(12, canvas.width * 0.014);\n                    ctx.fillStyle = '#10b981';\n                    ctx.beginPath();\n                    ctx.arc(r.x + r.w, r.y + r.h, handleR, 0, Math.PI * 2);\n                    ctx.fill();\n                    ctx.strokeStyle = '#ffffff';\n                    ctx.lineWidth = 3;\n                    ctx.stroke();\n                }\n                ctx.restore();\n            });\n        }\n\n        function renderFrameAtTime(t) {\n            ctx.fillStyle = '#000000';\n            ctx.fillRect(0, 0, canvas.width, canvas.height);\n\n            if (state.clips.length > 0) {\n                const info = getClipAtTimelineTime(t);\n                if (info) {\n                    const { clip, localTime } = info;\n                    const dur = getClipDuration(clip);\n\n                    let alpha = 1;\n                    if (clip.fade && dur > 0.8) {\n                        if (localTime < 0.3) alpha = localTime / 0.3;\n                        else if (localTime > dur - 0.3) alpha = Math.max(0, (dur - localTime) / 0.3);\n                    }\n\n                    if (clip.type === 'image') {\n                        drawMediaContain(clip.element, alpha);\n                    } else if (clip.type === 'video') {\n                        const targetVideoTime = clip.trimStart + localTime;\n                        if (!state.playback.isPlaying && Math.abs(clip.element.currentTime - targetVideoTime) > 0.08) {\n                            clip.element.currentTime = targetVideoTime;\n                        }\n                        drawMediaContain(clip.element, alpha);\n                    }\n                }\n            }\n\n            // Always composite all Icons / Overlay Pics on top\n            drawOverlaysOnCanvas();\n        }\n\n        function pauseAllVideosExcept(activeId) {\n            state.clips.forEach(c => {\n                if (c.type === 'video' && c.id !== activeId && !c.element.paused) {\n                    c.element.pause();\n                }\n            });\n        }\n\n        function startPlayback() {\n            if (state.clips.length === 0) {\n                showToast(\"Pehle koi video ya photo add karein!\");\n                return;\n            }\n            initAudioContext();\n\n            if (state.playback.currentTime >= state.playback.totalDuration - 0.05) {\n                state.playback.currentTime = 0;\n            }\n\n            state.playback.isPlaying = true;\n            state.playback.lastFrameTime = performance.now();\n            playIcon.setAttribute('data-lucide', 'pause');\n            playText.textContent = 'Pause';\n            lucide.createIcons();\n\n            if (state.bgAudio.url) {\n                state.bgAudio.element.currentTime = state.playback.currentTime % (state.bgAudio.element.duration || 9999);\n                state.bgAudio.element.play().catch(() => {});\n            }\n\n            requestAnimationFrame(playbackLoop);\n        }\n\n        function pausePlayback() {\n            state.playback.isPlaying = false;\n            playIcon.setAttribute('data-lucide', 'play');\n            playText.textContent = 'Play';\n            lucide.createIcons();\n\n            pauseAllVideosExcept(null);\n            if (state.bgAudio.url) {\n                state.bgAudio.element.pause();\n            }\n        }\n\n        function playbackLoop(now) {\n            if (!state.playback.isPlaying) return;\n\n            const dt = (now - state.playback.lastFrameTime) / 1000;\n            state.playback.lastFrameTime = now;\n            state.playback.currentTime += dt;\n\n            if (state.playback.currentTime >= state.playback.totalDuration) {\n                state.playback.currentTime = state.playback.totalDuration;\n                seekSlider.value = state.playback.currentTime;\n                currentTimeDisplay.textContent = formatTime(state.playback.currentTime);\n                renderFrameAtTime(state.playback.currentTime);\n                pausePlayback();\n                if (state.isExporting) finishExportRecording();\n                return;\n            }\n\n            const info = getClipAtTimelineTime(state.playback.currentTime);\n            if (info) {\n                const { clip, localTime } = info;\n                if (clip.type === 'video') {\n                    pauseAllVideosExcept(clip.id);\n                    connectVideoToMixer(clip.element);\n                    const desiredTime = clip.trimStart + localTime;\n                    if (clip.element.paused) {\n                        clip.element.currentTime = desiredTime;\n                        clip.element.play().catch(() => {});\n                    } else if (Math.abs(clip.element.currentTime - desiredTime) > 0.35) {\n                        clip.element.currentTime = desiredTime;\n                    }\n                } else {\n                    pauseAllVideosExcept(null);\n                }\n            }\n\n            seekSlider.value = state.playback.currentTime;\n            currentTimeDisplay.textContent = formatTime(state.playback.currentTime);\n            renderFrameAtTime(state.playback.currentTime);\n\n            if (state.isExporting) {\n                const pct = Math.min(100, Math.round((state.playback.currentTime / state.playback.totalDuration) * 100));\n                document.getElementById('exportProgressBar').style.width = `${pct}%`;\n                document.getElementById('exportProgressText').textContent = `${pct}%`;\n            }\n\n            requestAnimationFrame(playbackLoop);\n        }\n\n        function seekTo(time) {\n            state.playback.currentTime = Math.max(0, Math.min(state.playback.totalDuration, time));\n            seekSlider.value = state.playback.currentTime;\n            currentTimeDisplay.textContent = formatTime(state.playback.currentTime);\n\n            const info = getClipAtTimelineTime(state.playback.currentTime);\n            if (info && info.clip.type === 'video') {\n                info.clip.element.currentTime = info.clip.trimStart + info.localTime;\n            }\n            if (state.bgAudio.url && state.bgAudio.element.duration) {\n                state.bgAudio.element.currentTime = state.playback.currentTime % state.bgAudio.element.duration;\n            }\n            renderFrameAtTime(state.playback.currentTime);\n        }\n\n        playPauseBtn.addEventListener('click', () => {\n            if (state.playback.isPlaying) pausePlayback();\n            else startPlayback();\n        });\n\n        document.getElementById('restartBtn').addEventListener('click', () => seekTo(0));\n        seekSlider.addEventListener('input', (e) => seekTo(parseFloat(e.target.value)));\n\n        document.getElementById('aspectRatioSelect').addEventListener('change', (e) => {\n            state.aspectRatio = e.target.value;\n            updateCanvasDimensions();\n            saveHistoryState();\n        });\n\n        // ==================== EXPORT & DOWNLOAD VIDEO ====================\n        let mediaRecorder = null;\n        let recordedChunks = [];\n\n        document.getElementById('exportBtn').addEventListener('click', () => {\n            if (state.clips.length === 0) {\n                showToast(\"Download karne ke liye pehle videos ya photos jorein!\");\n                return;\n            }\n\n            // Lock any open icon selection before exporting\n            if (state.activeOverlayId) {\n                const active = getActiveOverlay();\n                if (active) active.locked = true;\n                state.activeOverlayId = null;\n                updateOverlayEditBar();\n                renderOverlaysList();\n            }\n\n            pausePlayback();\n            initAudioContext();\n\n            const canvasStream = canvas.captureStream(30);\n            const combinedStream = new MediaStream([\n                ...canvasStream.getVideoTracks(),\n                ...mixedDestination.stream.getAudioTracks()\n            ]);\n\n            const mimeTypes = [\n                'video/webm;codecs=vp9,opus',\n                'video/webm;codecs=vp8,opus',\n                'video/webm'\n            ];\n            const selectedMime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';\n\n            recordedChunks = [];\n            try {\n                mediaRecorder = selectedMime\n                    ? new MediaRecorder(combinedStream, { mimeType: selectedMime, videoBitsPerSecond: 4000000 })\n                    : new MediaRecorder(combinedStream);\n            } catch (err) {\n                showToast(\"Aap ka browser video export support nahi kar raha.\");\n                return;\n            }\n\n            mediaRecorder.ondataavailable = (e) => {\n                if (e.data && e.data.size > 0) recordedChunks.push(e.data);\n            };\n\n            mediaRecorder.onstop = () => {\n                const blob = new Blob(recordedChunks, { type: selectedMime || 'video/webm' });\n                const downloadUrl = URL.createObjectURL(blob);\n                const a = document.createElement('a');\n                a.href = downloadUrl;\n                a.download = `DramaCut_Video_${Date.now()}.webm`;\n                document.body.appendChild(a);\n                a.click();\n                document.body.removeChild(a);\n\n                document.getElementById('exportModal').classList.add('hidden');\n                state.isExporting = false;\n                showToast(\"Video mukammal taur par download ho gayi!\");\n            };\n\n            state.isExporting = true;\n            document.getElementById('exportModal').classList.remove('hidden');\n            document.getElementById('exportProgressBar').style.width = '0%';\n            document.getElementById('exportProgressText').textContent = '0%';\n\n            seekTo(0);\n            mediaRecorder.start(200);\n            startPlayback();\n        });\n\n        function finishExportRecording() {\n            if (mediaRecorder && mediaRecorder.state !== 'inactive') {\n                mediaRecorder.stop();\n            }\n        }\n\n        // ==================== DEMO CLIPS GENERATOR ====================\n        document.getElementById('loadDemoBtn').addEventListener('click', async () => {\n            showToast(\"Demo scenes load ho rahe hain...\");\n            const scenes = [\n                { title: \"Scene 1: Emotional Dialogue\", bg: \"#1e1b4b\", accent: \"#818cf8\" },\n                { title: \"Scene 2: Yaadein (Photo)\", bg: \"#31102f\", accent: \"#f472b6\" },\n                { title: \"Scene 3: Sad Ending\", bg: \"#0f172a\", accent: \"#38bdf8\" }\n            ];\n\n            for (const sc of scenes) {\n                const c = document.createElement('canvas');\n                c.width = 1280;\n                c.height = 720;\n                const g = c.getContext('2d');\n                g.fillStyle = sc.bg;\n                g.fillRect(0, 0, 1280, 720);\n                g.strokeStyle = sc.accent;\n                g.lineWidth = 8;\n                g.strokeRect(40, 40, 1200, 640);\n                g.fillStyle = \"#ffffff\";\n                g.font = \"bold 54px Inter, sans-serif\";\n                g.textAlign = \"center\";\n                g.fillText(sc.title, 640, 350);\n                g.fillStyle = sc.accent;\n                g.font = \"28px Inter, sans-serif\";\n                g.fillText(\"DramaCut Studio Sample Clip\", 640, 410);\n\n                await addImageClip(sc.title + \".png\", c.toDataURL('image/png'));\n            }\n            recalculateTotalDuration();\n            renderTimeline();\n            renderFrameAtTime(0);\n            saveHistoryState();\n            showToast(\"3 Demo Clips jor diye gaye! Ab 'Add Icon / Pic' ya 'Add Song' try karein.\");\n        });\n\n        // Initial setup & save base history state\n        updateCanvasDimensions();\n        updateLiveBadge();\n        saveHistoryState();\n    <\/script>\n<\/body>\n<\/html>"};</script>

function calc(b){let ex='',hist=[];const K=['C','(',')','⌫','√','π','^','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','%','='];

const press=k=>{if(k==='C')ex='';else if(k==='⌫')ex=ex.slice(0,-1);else if(k==='='){try{if(!/^[0-9+\-×÷−^().%√π ]*$/.test(ex))throw 0;const js=ex.replace(/π/g,'Math.PI').replace(/√(\d+\.?\d*|\([^)]*\))/g,'Math.sqrt($1)').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/%/g,'/100');const r=Function('"use strict";return ('+js+')')();if(!isFinite(r))throw 0;const s=String(+r.toPrecision(12));hist.push(ex+' = '+s);ex=s}catch(e){toast('Invalid expression')}}else ex+=k;draw()};draw()}
